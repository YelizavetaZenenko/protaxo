<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" fill="none" stroke="#2c4a56" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- Slight wobble so the lines read as drawn with a marker, not a ruler -->
    <filter id="marker" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="1" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="2.4"/>
    </filter>
  </defs>

  <g filter="url(#marker)" stroke-width="4.4" stroke-opacity="0.42">
    <!-- Cab (cab-over, facing left) -->
    <path d="M48 180 L45 112 Q45 98 49 86 L58 48 Q60 40 70 40 L168 40 Q176 40 176 48 L176 178"/>
    <!-- Roof deflector -->
    <path d="M72 40 Q98 14 164 16 L172 40"/>
    <!-- Side window -->
    <path d="M64 92 L73 56 L132 56 L132 92 Z"/>
    <!-- Door -->
    <path d="M60 100 L142 100 L142 170"/>
    <path d="M122 112 L134 112"/>
    <!-- Mirror -->
    <path d="M56 62 L40 64 L40 70"/>
    <rect x="34" y="70" width="10" height="24" rx="3"/>
    <!-- Headlight + bumper -->
    <path d="M45 146 L60 146"/>
    <path d="M42 166 L66 166 L66 184 L42 184 Z"/>
    <!-- Step -->
    <path d="M148 176 L168 176"/>
    <!-- Exhaust stack -->
    <path d="M182 156 L182 50 Q182 44 188 44 L188 156"/>

    <!-- Front wheel arch -->
    <path d="M68 184 A34 34 0 0 1 132 184"/>

    <!-- Trailer box -->
    <rect x="198" y="22" width="424" height="146" rx="4"/>
    <!-- Chassis -->
    <path d="M176 178 L300 178"/>
    <path d="M470 176 L622 176"/>
    <!-- Landing gear -->
    <path d="M330 168 L330 198 M320 200 L340 200"/>
    <!-- Mudflap behind drive axle -->
    <path d="M298 178 L298 208"/>
  </g>

  <!-- Trailer panel ribs, lighter so the silhouette leads -->
  <g filter="url(#marker)" stroke-width="3.2" stroke-opacity="0.2">
    <path d="M268 30 L268 160 M338 30 L338 160 M408 30 L408 160 M478 30 L478 160 M548 30 L548 160"/>
    <path d="M608 30 L608 160"/>
  </g>

  <!-- Wheels -->
  <g filter="url(#marker)" stroke-width="4.4" stroke-opacity="0.42">
    <circle cx="100" cy="196" r="22"/>
    <circle cx="224" cy="196" r="22"/>
    <circle cx="272" cy="196" r="22"/>
    <circle cx="530" cy="196" r="22"/>
    <circle cx="578" cy="196" r="22"/>
  </g>
  <g filter="url(#marker)" stroke-width="3.2" stroke-opacity="0.3">
    <circle cx="100" cy="196" r="7"/>
    <circle cx="224" cy="196" r="7"/>
    <circle cx="272" cy="196" r="7"/>
    <circle cx="530" cy="196" r="7"/>
    <circle cx="578" cy="196" r="7"/>
  </g>

  <!-- Road, broken like a quick marker stroke -->
  <g filter="url(#marker)" stroke-width="3" stroke-opacity="0.26">
    <path d="M14 222 L190 222 M206 222 L470 222 M486 222 L632 222"/>
  </g>
</svg>
