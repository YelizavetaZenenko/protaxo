spring.application.name=protaxo

spring.datasource.url=jdbc:postgresql://localhost:5432/protaxo
spring.datasource.username=postgres
spring.datasource.password=lizaliza123

# Schema is managed only by Flyway migrations, Hibernate must never auto-generate DDL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Mail (invitation emails). Defaults point at local MailHog (docker-compose) for dev/testing —
# emails never leave the machine, view them at http://localhost:8025.
# For REAL delivery, set these as environment variables before starting the app instead of
# editing this file — that keeps real credentials out of git. See docs/Реєстрація акаунтів (запрошення).md.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.base-url=${APP_BASE_URL:http://localhost:8080}
# Used only for the QR-code verification link ([[Print Agent]], TsplLabelBuilder.verifyUrl) — the
# rest of the app stays on app.base-url (Tailscale-only). Falls back to app.base-url when unset, so
# local dev needs no extra config; production sets PUBLIC_VERIFY_BASE_URL to the Tailscale Funnel
# address (a different port, reachable from the public internet) so a scan works without Tailscale.
app.public-verify-base-url=${PUBLIC_VERIFY_BASE_URL:${app.base-url}}

# Print Agent (наклейки для CalibrationProtocol) — фоновий процес на комп'ютері СТО, підключається
# по WebSocket на /ws/print-agent?token=... . Для реального розгортання ОБОВ'ЯЗКОВО задати
# PRINT_AGENT_TOKEN змінною середовища (значення нижче — лише для локальної розробки), той самий
# токен прописується в print-agent/printagent.properties. Див. docs/Print Agent.md.
print-agent.token=${PRINT_AGENT_TOKEN:dev-print-agent-token}

# Static files: long browser cache + content hash in the URL (style-<md5>.css),
# so reloads don't re-download images/CSS and a changed file still gets a new URL.
# Works because every template links static files via Thymeleaf @{...}, and
# url(...) inside CSS is rewritten by the resource chain too.
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# Фінанси: скан/фото підтвердного документа до витрати (docs/Фінансовий облік.md) — до 10 МБ,
# FinanceService перевіряє той самий ліміт і показує зрозуміле повідомлення.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Вихід після закриття всіх вкладок (docs/Безпека і ролі.md): коротка сесія, яку відкриті вкладки
# тримають пульсом /session/ping раз на хвилину; закриття останньої вкладки скорочує її до
# closing-grace. Хвилина пульсу — межа, до якої Chrome пригальмовує таймери у фонових вкладках.
server.servlet.session.timeout=3m
app.session.closing-grace=20s
