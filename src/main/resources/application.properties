spring.application.name=protaxo

spring.datasource.url=jdbc:postgresql://localhost:5432/protaxo
spring.datasource.username=postgres
spring.datasource.password=lizaliza123

# Schema is managed only by Flyway migrations, Hibernate must never auto-generate DDL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
