<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <title th:text="${editId} != null ? 'ProTaxo — Редагування позиції каталогу' : 'ProTaxo — Нова позиція каталогу'"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/topbar :: topbar(active='catalog')}"></div>

    <div class="container">
        <div class="card">
            <h1 th:text="${editId} != null ? 'Редагування позиції каталогу' : 'Нова позиція каталогу'"></h1>

            <form th:object="${catalogItem}"
                  th:action="${editId} != null ? @{/catalog-items/{id}/edit(id=${editId})} : @{/catalog-items}"
                  method="post" class="form-grid">

                <div class="alert alert-success field-full" sec:authorize="hasRole('ACCOUNTANT')">
                    Бухгалтер змінює ціну, залишок і ставку ПДВ; тип і назва — лише для перегляду.
                </div>

                <div class="field">
                    <label for="type">Тип *</label>
                    <input type="hidden" sec:authorize="hasRole('ACCOUNTANT')" name="type" th:value="*{type}">
                    <select id="type" th:field="*{type}" th:disabled="${#authorization.expression('hasRole(''ACCOUNTANT'')')}">
                        <option value="">— оберіть тип —</option>
                        <option th:each="t : ${types}" th:value="${t}"
                                th:text="${t.name() == 'MATERIAL'} ? 'Товар' : 'Послуга'"></option>
                    </select>
                    <div class="field-error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
                </div>

                <div class="field">
                    <label for="basePrice">Базова ціна (з ПДВ) *</label>
                    <input type="number" step="0.01" min="0" id="basePrice" th:field="*{basePrice}">
                    <div class="field-error" th:if="${#fields.hasErrors('basePrice')}" th:errors="*{basePrice}"></div>
                </div>

                <div class="field field-full">
                    <label for="name">Назва *</label>
                    <input type="text" id="name" th:field="*{name}"
                           th:readonly="${#authorization.expression('hasRole(''ACCOUNTANT'')')}">
                    <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="field">
                    <label for="stockQuantity">Залишок на складі</label>
                    <input type="number" step="0.001" min="0" inputmode="decimal" id="stockQuantity" th:field="*{stockQuantity}">
                    <div class="field-error" th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}"></div>
                    <div class="muted" id="stockQuantityHint">Недоступно для послуг</div>
                </div>

                <div class="field">
                    <label for="vatRate">Ставка ПДВ *</label>
                    <select id="vatRate" th:field="*{vatRate}">
                        <option th:each="r : ${vatRates}" th:value="${r}" th:text="${r.label}"></option>
                    </select>
                    <div class="field-error" th:if="${#fields.hasErrors('vatRate')}" th:errors="*{vatRate}"></div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn">Зберегти</button>
                    <a class="btn-outline" th:href="@{/catalog-items(activeType=${catalogItem.type})}">Скасувати</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var typeSelect = document.getElementById('type');
            var stockInput = document.getElementById('stockQuantity');

            /** Digits and a single decimal point pass through — stock now tracks fractional units
                (e.g. 2.5 liters), same precision as наряд-заказ line item quantities. */
            stockInput.addEventListener('input', function () {
                var cleaned = stockInput.value.replace(/[^\d.]/g, '');
                var firstDot = cleaned.indexOf('.');
                if (firstDot !== -1) {
                    cleaned = cleaned.slice(0, firstDot + 1) + cleaned.slice(firstDot + 1).replace(/\./g, '');
                }
                stockInput.value = cleaned;
            });

            function updateStockAvailability() {
                var isService = typeSelect.value === 'SERVICE';
                stockInput.disabled = isService;
                if (isService) stockInput.value = '';
            }

            typeSelect.addEventListener('change', updateStockAvailability);
            updateStockAvailability();
        });
    </script>
</body>
</html>
