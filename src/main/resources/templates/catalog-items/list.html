<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <title>ProTaxo — Каталог</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/topbar :: topbar(active='catalog')}"></div>

    <div class="container">
        <div class="card">
            <div class="toolbar">
                <h1>Каталог товарів і послуг</h1>
                <a class="btn" th:href="@{/catalog-items/new(activeType=${activeType})}">+ Нова позиція</a>
            </div>

            <div class="doc-tabs" style="margin-top:0;">
                <a class="doc-tab-btn" th:classappend="${activeType.name() == 'MATERIAL'} ? 'active'" th:href="@{/catalog-items(activeType='MATERIAL')}">Товари</a>
                <a class="doc-tab-btn" th:classappend="${activeType.name() == 'SERVICE'} ? 'active'" th:href="@{/catalog-items(activeType='SERVICE')}">Послуги</a>
            </div>

            <form th:action="@{/catalog-items}" method="get" class="filter-bar">
                <input type="hidden" name="activeType" th:value="${activeType}">
                <div class="field">
                    <label for="filterName">Назва</label>
                    <input type="text" id="filterName" name="filterName" th:value="${filterName}" placeholder="Пошук за назвою">
                </div>
                <div class="field filter-actions-field">
                    <label>&nbsp;</label>
                    <div class="filter-actions">
                        <button type="submit" class="btn-outline">Фільтрувати</button>
                        <a class="link-btn" th:if="${filterName != null}" th:href="@{/catalog-items(activeType=${activeType})}">Скинути фільтр</a>
                    </div>
                </div>
            </form>

            <table class="clean-table">
                <colgroup>
                    <col style="width:8%">
                    <col style="width:42%">
                    <col style="width:20%">
                    <col style="width:15%">
                    <col style="width:15%">
                </colgroup>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Назва</th>
                    <th>Базова ціна</th>
                    <th>Залишок</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="ci : ${catalogItems}" class="clickable-row" th:attr="data-href=@{/catalog-items/{id}(id=${ci.id})}">
                    <td th:text="${ci.id}"></td>
                    <td th:text="${ci.name}"></td>
                    <td th:text="${#numbers.formatDecimal(ci.basePrice, 1, 2)}"></td>
                    <td th:text="${ci.stockQuantity != null ? ci.stockQuantityDisplay() : '—'}"></td>
                    <td class="actions-cell">
                        <a class="link-btn" th:href="@{/catalog-items/{id}/edit(id=${ci.id})}">Редагувати</a>
                        <form sec:authorize="hasRole('ADMIN')" th:action="@{/catalog-items/{id}/delete(id=${ci.id})}" method="post" style="display:inline">
                            <button type="submit" class="link-btn link-btn-danger"
                                    onclick="return confirm('Видалити позицію каталогу?')">Видалити</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(catalogItems)}">
                    <td colspan="5" th:text="${activeType.name() == 'MATERIAL'} ? 'Товарів ще немає' : 'Послуг ще немає'"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.clickable-row').forEach(function (row) {
                row.addEventListener('click', function (e) {
                    if (e.target.closest('.actions-cell')) return;
                    window.location.href = row.dataset.href;
                });
            });
        });
    </script>
</body>
</html>
