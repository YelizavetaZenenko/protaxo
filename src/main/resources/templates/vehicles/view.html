<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <title th:text="'ProTaxo — ' + ${vehicle.registrationNumber}"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/topbar :: topbar(active='vehicles')}"></div>

    <div class="container">
        <div class="card">
            <div class="toolbar">
                <h1 th:text="${vehicle.registrationNumber}"></h1>
                <div class="actions-cell">
                    <a class="btn-outline" th:href="@{/vehicles/{id}/edit(id=${vehicle.id})}">Редагувати</a>
                    <a class="btn-outline" th:href="@{/vehicles}">Назад до списку</a>
                </div>
            </div>

            <div class="view-meta">
                <div class="field">
                    <label>Контрагент</label>
                    <div th:text="${clientName}"></div>
                </div>
                <div class="field">
                    <label>VIN</label>
                    <div th:text="${vehicle.vin}"></div>
                </div>
                <div class="field" th:if="${not #strings.isEmpty(vehicle.chassisNumber)}">
                    <label>Номер кузова</label>
                    <div th:text="${vehicle.chassisNumber}"></div>
                </div>
                <div class="field">
                    <label>Держномер</label>
                    <div th:text="${vehicle.registrationNumber}"></div>
                </div>
                <div class="field">
                    <label>Марка</label>
                    <div th:text="${vehicle.make}"></div>
                </div>
                <div class="field">
                    <label>Модель</label>
                    <div th:text="${vehicle.model}"></div>
                </div>
                <div class="field">
                    <label>Рік випуску</label>
                    <div th:text="${vehicle.year}"></div>
                </div>
            </div>

            <h2 class="view-section-title" style="margin-top:2rem;">Тахографи</h2>
            <table class="clean-table">
                <thead>
                <tr>
                    <th>Виробник</th>
                    <th>Модель</th>
                    <th>Заводський номер</th>
                    <th>Дата випуску</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${tachographs}" class="clickable-row" th:attr="data-href=@{/tachographs/{id}(id=${t.id})}">
                    <td th:text="${t.manufacturer}"></td>
                    <td th:text="${t.model}"></td>
                    <td th:text="${t.serialNumber}"></td>
                    <td th:text="${t.productionDate}"></td>
                    <td class="actions-cell">
                        <a class="link-btn" th:href="@{/tachographs/{id}/edit(id=${t.id})}">Редагувати</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(tachographs)}">
                    <td colspan="5">У цього автомобіля ще немає тахографів.</td>
                </tr>
                </tbody>
            </table>
            <a class="btn-outline" style="margin-top:0.75rem;display:inline-block;"
               th:href="@{/tachographs/new}">+ Новий тахограф</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.clickable-row').forEach(function (row) {
                row.addEventListener('click', function (e) {
                    if (e.target.closest('.actions-cell')) return;
                    window.location.href = row.dataset.href;
                });
            });
        });
    </script>
</body>
</html>
