<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="60">
    <title>ProTaxo — Технічні роботи</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preload" as="image" th:href="@{/images/truck.png}">
</head>
<body class="auth-page">
    <div class="auth-card card maintenance-card">
        <div class="brand-lockup">
            <svg viewBox="0 0 200 200" class="brand-gauge" aria-hidden="true">
                <g class="brand-gauge-cog">
                    <rect x="92" y="20" width="16" height="24" rx="3"></rect>
                    <rect x="92" y="156" width="16" height="24" rx="3"></rect>
                    <rect x="92" y="20" width="16" height="24" rx="3" transform="rotate(36 100 100)"></rect>
                    <rect x="92" y="20" width="16" height="24" rx="3" transform="rotate(72 100 100)"></rect>
                    <rect x="92" y="20" width="16" height="24" rx="3" transform="rotate(108 100 100)"></rect>
                    <rect x="92" y="20" width="16" height="24" rx="3" transform="rotate(144 100 100)"></rect>
                    <rect x="92" y="20" width="16" height="24" rx="3" transform="rotate(180 100 100)"></rect>
                    <rect x="92" y="20" width="16" height="24" rx="3" transform="rotate(216 100 100)"></rect>
                    <rect x="92" y="20" width="16" height="24" rx="3" transform="rotate(252 100 100)"></rect>
                    <rect x="92" y="20" width="16" height="24" rx="3" transform="rotate(288 100 100)"></rect>
                    <rect x="92" y="20" width="16" height="24" rx="3" transform="rotate(324 100 100)"></rect>
                    <circle cx="100" cy="100" r="62"></circle>
                </g>
                <circle cx="100" cy="100" r="47" class="brand-gauge-face"></circle>
                <circle cx="100" cy="100" r="34" class="brand-gauge-arc" transform="rotate(135 100 100)"></circle>
                <line x1="100" y1="100" x2="100" y2="70" class="brand-gauge-needle"></line>
                <circle cx="100" cy="100" r="7" class="brand-gauge-hub"></circle>
            </svg>
            <div class="brand-lockup-text">
                <span class="brand-name">ProTaxo</span>
                <span class="brand-kicker">Ремонт і калібрування тахографів</span>
            </div>
        </div>
        <h1>Технічні роботи</h1>
        <p>Зараз ми оновлюємо систему. Сайт тимчасово недоступний.</p>
        <p>Спробуйте трохи пізніше — сторінка оновиться сама, щойно роботи завершаться.</p>
    </div>
</body>
</html>
