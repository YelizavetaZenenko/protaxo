<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <title th:text="${editId != null} ? 'ProTaxo — Редагування рахунку' : 'ProTaxo — Новий рахунок'"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/topbar :: topbar(active='finance')}"></div>

    <div class="container">
        <div class="card">
            <h1 th:text="${editId != null} ? 'Редагування рахунку' : 'Новий рахунок'"></h1>
            <div th:replace="~{fragments/finance :: flash}"></div>

            <form th:object="${account}"
                  th:action="${editId != null} ? @{/finance/accounts/{id}/edit(id=${editId})} : @{/finance/accounts}"
                  method="post" class="form-grid">
                <div class="field field-full">
                    <label for="name">Назва *</label>
                    <input type="text" id="name" th:field="*{name}" required placeholder="Напр. ПриватБанк UA…">
                </div>
                <div class="field">
                    <label for="kind">Вид *</label>
                    <select id="kind" th:field="*{kind}">
                        <option th:each="k : ${kinds}" th:value="${k}" th:text="${k.label}"></option>
                    </select>
                </div>
                <div class="field">
                    <label for="openingBalance">Початковий залишок</label>
                    <input type="number" step="0.01" min="0" id="openingBalance" th:field="*{openingBalance}">
                </div>
                <div class="field field-full checkbox-field" th:if="${editId != null}">
                    <label><input type="checkbox" th:field="*{active}"> Активний (доступний для нових операцій)</label>
                </div>
                <p class="muted field-full">
                    Початковий залишок — кошти, що вже були на момент початку обліку в програмі. Це не оплата
                    від клієнта. Коли по рахунку вже є операції, вид і початковий залишок змінити не можна —
                    розбіжність виправляється через звірку.
                </p>
                <div class="form-actions">
                    <button type="submit" class="btn">Зберегти</button>
                    <a class="btn-outline" th:href="@{/finance/accounts}">Скасувати</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
