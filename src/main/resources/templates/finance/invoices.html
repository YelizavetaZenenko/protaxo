<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <title>ProTaxo — Наряди й оплати</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/topbar :: topbar(active='finance')}"></div>

    <div class="container container-wide acc-page">
        <div th:replace="~{fragments/finance :: header}"></div>
        <div th:replace="~{fragments/finance :: nav(section='invoices')}"></div>
        <div th:replace="~{fragments/finance :: flash}"></div>
        <div th:replace="~{fragments/finance :: kpis}"></div>

        <section class="acc-card">
            <div class="acc-card-head">
                <h2>Наряди й оплати</h2>
                <span class="acc-card-meta" th:text="${#lists.size(rows)} + ' із ' + ${@financeFormat.plural(rowsTotal, 'наряду', 'нарядів', 'нарядів')}"></span>
            </div>
            <div class="acc-toolbar">
                <div th:replace="~{fragments/finance :: filters('/finance/invoices')}"></div>
                <form th:action="@{/finance/invoices}" method="get" class="acc-search">
                    <input type="hidden" name="from" th:value="${from}">
                    <input type="hidden" name="to" th:value="${to}">
                    <input type="hidden" name="filter" th:value="${filter}">
                    <input type="search" name="q" th:value="${q}" placeholder="Номер, клієнт або авто">
                </form>
            </div>
            <div class="table-scroll">
                <table th:replace="~{fragments/finance :: paymentsTable(${rows})}"></table>
            </div>
        </section>

        <div th:replace="~{fragments/finance :: footer}"></div>
    </div>

    <div th:replace="~{fragments/finance :: paymentDialog}"></div>
</body>
</html>
