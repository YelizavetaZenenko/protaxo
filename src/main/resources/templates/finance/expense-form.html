<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <title>ProTaxo — Нова витрата</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/topbar :: topbar(active='finance')}"></div>

    <div class="container container-wide">
        <div class="card">
            <h1>Нова витрата</h1>
            <div th:replace="~{fragments/finance :: nav(section='expenses')}"></div>
            <div th:replace="~{fragments/finance :: flash}"></div>

            <form th:object="${expense}" th:action="@{/finance/expenses}" method="post" enctype="multipart/form-data"
                  class="form-grid form-grid-wide" id="expenseForm">
                <input type="hidden" th:field="*{requestKey}">
                <div class="field">
                    <label for="amount">Сума *</label>
                    <input type="number" step="0.01" min="0.01" id="amount" th:field="*{amount}" required>
                    <div class="muted" id="amountHint" hidden>Рахується автоматично з товарів нижче</div>
                </div>
                <div class="field">
                    <label for="category">Категорія *</label>
                    <select id="category" th:field="*{category}" required>
                        <option value="">— оберіть —</option>
                        <option th:each="c : ${categories}" th:value="${c}" th:text="${c.label}"></option>
                    </select>
                </div>

                <!-- Закупівля товарів: лише для «Запчастини та матеріали». Після збереження товари
                     оприбутковуються на склад, ціна закупівлі оновлюється в каталозі, нові позиції
                     додаються в каталог. -->
                <div class="field field-full items-section" id="goodsSection" hidden>
                    <label>Товари з каталогу</label>
                    <table class="items-table">
                        <thead>
                        <tr>
                            <th style="width:3%">№</th>
                            <th>Товар</th>
                            <th class="num num-input" style="width:12%">Кількість</th>
                            <th class="num num-input" style="width:15%">Ціна закупівлі</th>
                            <th class="num" style="width:13%">Сума</th>
                            <th style="width:3%"></th>
                        </tr>
                        </thead>
                        <tbody id="goodsBody">
                        <tr th:each="line, st : *{items}" class="goods-row">
                            <td class="row-index"></td>
                            <td>
                                <select class="goods-select">
                                    <option value="">— оберіть товар —</option>
                                    <option value="__new__">+ Нова позиція в каталог</option>
                                    <option th:each="ci : ${materialItems}" th:value="${ci.id}"
                                            th:attr="data-purchase=${ci.purchasePrice}"
                                            th:text="${ci.name} + ' (залишок ' + (${ci.stockQuantity} != null ? ${ci.stockQuantityDisplay()} : '0') + ')'"></option>
                                </select>
                                <input type="hidden" class="goods-id" th:name="|items[${st.index}].catalogItemId|" th:value="${line.catalogItemId}">
                                <div class="goods-new" hidden>
                                    <input type="text" class="goods-new-name" th:name="|items[${st.index}].newItemName|" th:value="${line.newItemName}" placeholder="Назва нового товару">
                                    <input type="number" step="0.01" min="0" class="goods-new-price" th:name="|items[${st.index}].newItemSalePrice|" th:value="${line.newItemSalePrice}" placeholder="Ціна продажу (з ПДВ)">
                                </div>
                            </td>
                            <td><input type="number" step="0.001" min="0" class="qty-input" th:name="|items[${st.index}].quantity|" th:value="${line.quantity}"></td>
                            <td><input type="number" step="0.01" min="0" class="price-input" th:name="|items[${st.index}].purchasePrice|" th:value="${line.purchasePrice}"></td>
                            <td class="amount-cell"><span class="amount-display">0.00</span></td>
                            <td><button type="button" class="remove-row-btn" title="Видалити рядок">✕</button></td>
                        </tr>
                        </tbody>
                        <tfoot>
                        <tr>
                            <td colspan="4">Разом</td>
                            <td class="amount-cell" id="goodsTotal">0.00</td>
                            <td></td>
                        </tr>
                        </tfoot>
                    </table>
                    <button type="button" class="btn-outline" id="addGoodsRowBtn" style="margin-top:0.75rem;">+ Додати товар</button>
                    <div class="muted" style="margin-top:0.5rem;">
                        Після збереження товар надійде на склад (залишок збільшиться), ціна закупівлі оновиться в каталозі,
                        нові позиції з'являться в каталозі як товари (ПДВ 20%).
                    </div>
                </div>

                <div class="field field-full">
                    <label for="purpose">Призначення *</label>
                    <input type="text" id="purpose" th:field="*{purpose}" required>
                </div>
                <div class="field">
                    <label for="accountId">З якої каси / рахунку *</label>
                    <select id="accountId" th:field="*{accountId}" required>
                        <option value="">— оберіть —</option>
                        <option th:each="a : ${accounts}" th:value="${a.id}" th:text="${a.name} + ' (' + ${a.kind.label} + ')'"></option>
                    </select>
                </div>
                <div class="field">
                    <label for="counterparty">Постачальник / одержувач</label>
                    <input type="text" id="counterparty" th:field="*{counterparty}">
                </div>
                <div class="field">
                    <label for="documentRef">Документ (№ чека, накладної)</label>
                    <input type="text" id="documentRef" th:field="*{documentRef}">
                </div>
                <div class="field">
                    <label for="invoiceNumber">Наряд № (якщо витрата на конкретну роботу)</label>
                    <input type="text" id="invoiceNumber" th:field="*{invoiceNumber}" placeholder="000123">
                </div>
                <div class="field field-full">
                    <label for="attachment">Скан / фото документа (до 10 МБ)</label>
                    <input type="file" id="attachment" name="attachment" accept="image/*,application/pdf">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn">Зберегти витрату</button>
                    <a class="btn-outline" th:href="@{/finance/expenses}">Скасувати</a>
                </div>
            </form>
        </div>
    </div>

    <template id="goodsRowTemplate">
        <tr class="goods-row">
            <td class="row-index"></td>
            <td>
                <select class="goods-select">
                    <option value="">— оберіть товар —</option>
                    <option value="__new__">+ Нова позиція в каталог</option>
                    <option th:each="ci : ${materialItems}" th:value="${ci.id}"
                            th:attr="data-purchase=${ci.purchasePrice}"
                            th:text="${ci.name} + ' (залишок ' + (${ci.stockQuantity} != null ? ${ci.stockQuantityDisplay()} : '0') + ')'"></option>
                </select>
                <input type="hidden" class="goods-id" name="items[__INDEX__].catalogItemId">
                <div class="goods-new" hidden>
                    <input type="text" class="goods-new-name" name="items[__INDEX__].newItemName" placeholder="Назва нового товару">
                    <input type="number" step="0.01" min="0" class="goods-new-price" name="items[__INDEX__].newItemSalePrice" placeholder="Ціна продажу (з ПДВ)">
                </div>
            </td>
            <td><input type="number" step="0.001" min="0" class="qty-input" name="items[__INDEX__].quantity"></td>
            <td><input type="number" step="0.01" min="0" class="price-input" name="items[__INDEX__].purchasePrice"></td>
            <td class="amount-cell"><span class="amount-display">0.00</span></td>
            <td><button type="button" class="remove-row-btn" title="Видалити рядок">✕</button></td>
        </tr>
    </template>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var category = document.getElementById('category');
            var section = document.getElementById('goodsSection');
            var body = document.getElementById('goodsBody');
            var amount = document.getElementById('amount');
            var amountHint = document.getElementById('amountHint');
            var totalEl = document.getElementById('goodsTotal');

            function toNumber(v) {
                var n = parseFloat(v);
                return isNaN(n) ? 0 : n;
            }

            function goodsActive() {
                return category.value === 'PARTS';
            }

            function renumber() {
                Array.prototype.forEach.call(body.querySelectorAll('.goods-row'), function (row, idx) {
                    row.querySelector('.row-index').textContent = idx + 1;
                    row.querySelectorAll('input[name]').forEach(function (f) {
                        f.name = f.name.replace(/items\[\d+]/, 'items[' + idx + ']');
                    });
                });
            }

            function recalc() {
                var total = 0;
                body.querySelectorAll('.goods-row').forEach(function (row) {
                    var sum = Math.round(toNumber(row.querySelector('.qty-input').value)
                        * toNumber(row.querySelector('.price-input').value) * 100) / 100;
                    row.querySelector('.amount-display').textContent = sum.toFixed(2);
                    total += sum;
                });
                totalEl.textContent = total.toFixed(2);
                var hasRows = goodsActive() && body.querySelector('.goods-row') !== null;
                amount.readOnly = hasRows;
                amountHint.hidden = !hasRows;
                if (hasRows) amount.value = total > 0 ? total.toFixed(2) : '';
            }

            // Вибір у списку: наявний товар → id у приховане поле (+ підставити ціну закупівлі з
            // каталогу); «Нова позиція» → поля назви й ціни продажу.
            function syncRow(row, fillPrice) {
                var select = row.querySelector('.goods-select');
                var isNew = select.value === '__new__';
                row.querySelector('.goods-id').value = isNew ? '' : select.value;
                row.querySelector('.goods-new').hidden = !isNew;
                row.querySelector('.goods-new-name').required = isNew;
                row.querySelector('.goods-new-price').required = isNew;
                var option = select.selectedOptions[0];
                var priceInput = row.querySelector('.price-input');
                if (fillPrice && !isNew && option && option.dataset.purchase && !priceInput.value) {
                    priceInput.value = option.dataset.purchase;
                }
                var qty = row.querySelector('.qty-input');
                if (fillPrice && select.value && !qty.value) qty.value = '1';
            }

            function restoreRow(row) {
                var id = row.querySelector('.goods-id').value;
                var select = row.querySelector('.goods-select');
                if (id) {
                    select.value = id;
                } else if (row.querySelector('.goods-new-name').value) {
                    select.value = '__new__';
                }
                syncRow(row, false);
            }

            function addRow() {
                var html = document.getElementById('goodsRowTemplate').innerHTML
                    .replace(/__INDEX__/g, body.querySelectorAll('.goods-row').length);
                var wrapper = document.createElement('tbody');
                wrapper.innerHTML = html.trim();
                body.appendChild(wrapper.firstElementChild);
                renumber();
                recalc();
            }

            function updateSection() {
                section.hidden = !goodsActive();
                // Приховані рядки не мають потрапити у витрату іншої категорії.
                body.querySelectorAll('input, select').forEach(function (f) { f.disabled = !goodsActive(); });
                if (goodsActive() && !body.querySelector('.goods-row')) addRow();
                recalc();
            }

            body.addEventListener('change', function (e) {
                if (e.target.classList.contains('goods-select')) {
                    syncRow(e.target.closest('tr'), true);
                    recalc();
                }
            });
            body.addEventListener('input', function (e) {
                if (e.target.classList.contains('qty-input') || e.target.classList.contains('price-input')) recalc();
            });
            body.addEventListener('click', function (e) {
                if (e.target.classList.contains('remove-row-btn')) {
                    e.target.closest('tr').remove();
                    renumber();
                    recalc();
                }
            });
            document.getElementById('addGoodsRowBtn').addEventListener('click', addRow);
            category.addEventListener('change', updateSection);

            body.querySelectorAll('.goods-row').forEach(restoreRow);
            renumber();
            updateSection();
        });
    </script>
</body>
</html>
