<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <title>ProTaxo — Витрати</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/topbar :: topbar(active='finance')}"></div>

    <div class="container container-wide acc-page">
        <div th:replace="~{fragments/finance :: header}"></div>
        <div th:replace="~{fragments/finance :: nav(section='expenses')}"></div>
        <div th:replace="~{fragments/finance :: flash}"></div>
        <div th:replace="~{fragments/finance :: kpis}"></div>

        <section class="acc-card">
            <div class="acc-card-head">
                <h2>Витрати сервісу</h2>
                <div class="acc-card-head-actions">
                    <span class="acc-card-meta" th:text="${@financeFormat.period(from, to)}"></span>
                    <a class="btn-outline btn-sm" th:href="@{/finance/expenses/new}">+ Нова витрата</a>
                </div>
            </div>
            <div class="table-scroll">
                <table class="acc-table">
                    <thead>
                    <tr>
                        <th>Дата</th>
                        <th>Призначення</th>
                        <th>Категорія</th>
                        <th class="money">Сума</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="op : ${expenses}" th:classappend="${op.cancelled()} ? 'row-cancelled'">
                        <td th:text="${#temporals.format(op.occurredAt, 'dd.MM')}"
                            th:title="${#temporals.format(op.occurredAt, 'dd.MM.yyyy HH:mm')} + ' · ' + ${op.createdByName}"></td>
                        <td>
                            <div class="acc-cell-main" th:text="${op.comment}"></div>
                            <div class="acc-cell-sub keep-text" th:if="${op.counterparty != null or op.invoiceId != null or op.attachmentId != null}">
                                <span th:if="${op.counterparty != null}" th:text="${op.counterparty}"></span>
                                <a th:if="${op.invoiceId != null}" th:href="@{/invoices/{id}(id=${op.invoiceId})}" th:text="'· наряд № ' + ${op.invoiceNumber}"></a>
                                <a th:if="${op.attachmentId != null}" th:href="@{/finance/attachments/{id}(id=${op.attachmentId})}" target="_blank">· документ</a>
                            </div>
                        </td>
                        <td th:text="${op.expenseCategory.label}"></td>
                        <td class="money" th:text="${@financeFormat.money(op.amount)}"></td>
                        <td class="acc-row-action keep-text">
                            <a th:unless="${op.cancelled()}" class="link-btn link-btn-danger" th:href="@{/finance/operations/{id}/cancel(id=${op.id})}">Скасувати</a>
                            <span th:if="${op.cancelled()}" class="muted" th:title="${op.cancelReason}">Скасовано</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(expenses)}">
                        <td colspan="5" class="acc-empty">Витрат за цей період немає</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <p class="acc-note">Внутрішній запис витрати не підтверджує її податкове врахування чи право на податковий кредит.</p>
        </section>

        <div th:replace="~{fragments/finance :: footer}"></div>
    </div>

    <div th:replace="~{fragments/finance :: paymentDialog}"></div>
</body>
</html>
