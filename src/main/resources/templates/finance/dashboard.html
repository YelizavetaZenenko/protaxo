<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <title>ProTaxo — Панель бухгалтера</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/topbar :: topbar(active='finance')}"></div>

    <div class="container container-wide acc-page">
        <div th:replace="~{fragments/finance :: header}"></div>
        <div th:replace="~{fragments/finance :: nav(section='overview')}"></div>
        <div th:replace="~{fragments/finance :: flash}"></div>
        <div th:replace="~{fragments/finance :: kpis}"></div>

        <section class="acc-card">
            <div class="acc-card-head">
                <h2>Контроль оплат</h2>
                <span class="acc-card-meta" th:text="${#lists.size(rows)} + ' із ' + ${@financeFormat.plural(rowsTotal, 'наряду', 'нарядів', 'нарядів')}"></span>
            </div>
            <div th:replace="~{fragments/finance :: filters('/finance')}"></div>
            <div class="table-scroll">
                <table th:replace="~{fragments/finance :: paymentsTable(${rows})}"></table>
            </div>
            <div class="acc-card-more" th:if="${rowsTotal > #lists.size(rows)}">
                <a th:href="@{/finance/invoices(from=${from}, to=${to}, filter=${filter})}">Усі наряди й оплати →</a>
            </div>
        </section>

        <div class="acc-bottom">
            <section class="acc-card">
                <div class="acc-card-head"><h2>Потребує уваги</h2></div>
                <div class="acc-item">
                    <div>
                        <div class="acc-item-title">Прострочені оплати</div>
                        <div class="acc-item-sub" th:text="${overdueCount == 0} ? 'Прострочених оплат немає'
                                : ${@financeFormat.plural(overdueCount, 'наряд', 'наряди', 'нарядів')} + ' · перевірити надходження'"></div>
                    </div>
                    <a class="btn-outline btn-sm" th:href="@{/finance/invoices(from=${from}, to=${to}, filter='overdue')}">Переглянути</a>
                </div>
                <div class="acc-item">
                    <div>
                        <div class="acc-item-title">Закриття документів</div>
                        <div class="acc-item-sub" th:text="${actsPending == 0} ? 'Усі акти підписані'
                                : ${@financeFormat.plural(actsPending, 'акт очікує', 'акти очікують', 'актів очікують')} + ' створення або підпису'"></div>
                    </div>
                    <a class="btn-outline btn-sm" th:href="@{/finance/documents(from=${from}, to=${to}, pendingOnly=true)}">Відкрити</a>
                </div>
                <div class="acc-item" th:if="${!#lists.isEmpty(openReconciliations)}">
                    <div>
                        <div class="acc-item-title">Розбіжності звірок каси</div>
                        <div class="acc-item-sub" th:text="${@financeFormat.plural(#lists.size(openReconciliations), 'розбіжність', 'розбіжності', 'розбіжностей')} + ' не розглянуто'"></div>
                    </div>
                    <a class="btn-outline btn-sm" th:href="@{/finance/reconciliations}">Розглянути</a>
                </div>
            </section>

            <section class="acc-card">
                <div class="acc-card-head"><h2>Налаштування обліку</h2></div>
                <div class="acc-item">
                    <div>
                        <div class="acc-item-title">Податки та звітність</div>
                        <div class="acc-item-sub" th:text="${settings.taxSummary() != null} ? ${settings.taxSummary()} : 'Систему оподаткування ще не вказано'"></div>
                    </div>
                    <a class="btn-outline btn-sm" th:href="@{/finance/settings}">Налаштувати</a>
                </div>
                <div class="acc-item">
                    <div>
                        <div class="acc-item-title">Банківська виписка</div>
                        <div class="acc-item-sub">Джерело надходжень не підключено</div>
                    </div>
                    <span class="status-badge status-paid" th:text="${settings.bankStatementSource.label}"></span>
                </div>
            </section>
        </div>

        <div th:replace="~{fragments/finance :: footer}"></div>
    </div>

    <div th:replace="~{fragments/finance :: paymentDialog}"></div>
</body>
</html>
