<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ProTaxo — Відновлення паролю</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
    <div class="auth-card card">
        <h1>ProTaxo ERP</h1>

        <div class="alert alert-success" th:if="${param.sent}">
            Якщо такий email є в системі — на нього надіслано лист з посиланням для відновлення паролю.
        </div>

        <div th:if="${param.sent == null}">
            <p class="muted">Введіть email — надішлемо посилання для встановлення нового паролю.</p>

            <form th:object="${form}" th:action="@{/forgot-password}" method="post">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" autocomplete="username" required autofocus>
                    <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <button type="submit" class="btn btn-block">Надіслати посилання</button>
            </form>
        </div>

        <a class="auth-back-link" th:href="@{/login}">← До сторінки входу</a>
    </div>
</body>
</html>
