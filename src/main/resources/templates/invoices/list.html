<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>ProTaxo — Наряд-заказ</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/topbar :: topbar(active='invoices')}"></div>

    <div class="container">
        <div class="card" id="invoicesCard">
            <div class="toolbar">
                <h1>Наряд-заказ</h1>
                <a class="btn" th:href="@{/invoices/new}">+ Новий наряд-заказ</a>
            </div>

            <form th:action="@{/invoices}" method="get" class="filter-bar">
                <input type="hidden" name="sort" th:value="${sort}">
                <input type="hidden" name="dir" th:value="${dir}">
                <div class="field">
                    <label for="filterDateDisplay">Дата</label>
                    <input type="text" id="filterDateDisplay" class="picker-input" readonly placeholder="Усі дати">
                    <input type="hidden" id="filterDateFrom" name="filterDateFrom" th:value="${filterDateFrom}">
                    <input type="hidden" id="filterDateTo" name="filterDateTo" th:value="${filterDateTo}">
                </div>
                <div class="field">
                    <label for="filterPaymentType">Тип оплати</label>
                    <select id="filterPaymentType" name="filterPaymentType">
                        <option value="">— усі —</option>
                        <option th:each="pt : ${paymentTypes}" th:value="${pt}" th:text="${pt.label}"
                                th:selected="${pt == filterPaymentType}"></option>
                    </select>
                </div>
                <div class="field filter-actions-field">
                    <label>&nbsp;</label>
                    <div class="filter-actions">
                        <button type="submit" class="btn-outline">Фільтрувати</button>
                        <a class="link-btn" th:if="${filterDateFrom != null or filterDateTo != null or filterPaymentType != null}"
                           th:href="@{/invoices(sort=${sort}, dir=${dir})}">Скинути фільтр</a>
                    </div>
                </div>
            </form>

            <table class="clean-table">
                <colgroup>
                    <col style="width:12%">
                    <col style="width:16%">
                    <col style="width:20%">
                    <col style="width:20%">
                    <col style="width:12%">
                    <col style="width:20%">
                </colgroup>
                <thead>
                <tr>
                    <th>№</th>
                    <th>
                        <a class="sort-link" th:classappend="${sort == 'date'} ? 'active'"
                           th:href="@{/invoices(sort='date', dir=${sort == 'date' && dir == 'asc' ? 'desc' : 'asc'})}">
                            Дата
                            <span th:if="${sort == 'date'}" th:text="${dir == 'asc'} ? '▲' : '▼'"></span>
                        </a>
                    </th>
                    <th>
                        <a class="sort-link" th:classappend="${sort == 'paymentType'} ? 'active'"
                           th:href="@{/invoices(sort='paymentType', dir=${sort == 'paymentType' && dir == 'asc' ? 'desc' : 'asc'})}">
                            Тип оплати
                            <span th:if="${sort == 'paymentType'}" th:text="${dir == 'asc'} ? '▲' : '▼'"></span>
                        </a>
                    </th>
                    <th>Контрагент</th>
                    <th>Сума</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="inv : ${invoices}" class="clickable-row" th:attr="data-href=@{/invoices/{id}(id=${inv.id})}">
                    <td th:text="${inv.number}"></td>
                    <td th:text="${#temporals.format(inv.documentDate, 'dd.MM.yyyy HH:mm')}"></td>
                    <td th:text="${inv.paymentType.label}"></td>
                    <td th:text="${clientNames[inv.clientId]}"></td>
                    <td th:text="${#numbers.formatDecimal(inv.totalAmount, 1, 2)}"></td>
                    <td class="actions-cell">
                        <a class="link-btn" th:href="@{/invoices/{id}/edit(id=${inv.id})}">Редагувати</a>
                        <a class="link-btn" th:href="@{/invoices/{id}/pdf(id=${inv.id})}" target="_blank">Друк</a>
                        <form sec:authorize="hasRole('ADMIN')" th:action="@{/invoices/{id}/delete(id=${inv.id})}" method="post" style="display:inline">
                            <button type="submit" class="link-btn link-btn-danger"
                                    onclick="return confirm('Видалити наряд-заказ?')">Видалити</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(invoices)}">
                    <td colspan="6">Наряд-заказів ще немає</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <button type="button" id="scrollTopBtn" class="scroll-top-btn" title="Нагору, до таблиці" hidden>↑ Нагору</button>

    <div class="modal-overlay" id="dateRangeModalOverlay" hidden>
        <div class="modal">
            <h2>Період</h2>
            <div class="field">
                <label for="dateRangeFromInput">Дата від</label>
                <input type="date" id="dateRangeFromInput">
            </div>
            <div class="field">
                <label for="dateRangeToInput">Дата до</label>
                <input type="date" id="dateRangeToInput">
            </div>
            <div class="form-actions">
                <button type="button" class="btn" id="applyDateRangeBtn">Застосувати</button>
                <button type="button" class="btn-outline" id="clearDateRangeBtn">Скинути</button>
                <button type="button" class="btn-outline" id="cancelDateRangeBtn">Скасувати</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var btn = document.getElementById('scrollTopBtn');
            var card = document.getElementById('invoicesCard');

            window.addEventListener('scroll', function () {
                btn.hidden = window.scrollY < 200;
            });

            btn.addEventListener('click', function () {
                card.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });

            document.querySelectorAll('.clickable-row').forEach(function (row) {
                row.addEventListener('click', function (e) {
                    if (e.target.closest('.actions-cell')) return;
                    window.location.href = row.dataset.href;
                });
            });
        });
    </script>

    <script>
        /**
         * "Дата від"/"Дата до" used to be two separate visible fields in the filter bar — merged
         * into this single field + modal at the user's request. The two real filter values still
         * travel to the server as the same filterDateFrom/filterDateTo params (hidden inputs),
         * only the picker UI changed.
         */
        document.addEventListener('DOMContentLoaded', function () {
            var display = document.getElementById('filterDateDisplay');
            var fromHidden = document.getElementById('filterDateFrom');
            var toHidden = document.getElementById('filterDateTo');
            var overlay = document.getElementById('dateRangeModalOverlay');
            var fromInput = document.getElementById('dateRangeFromInput');
            var toInput = document.getElementById('dateRangeToInput');

            function formatDisplayDate(iso) {
                var parts = iso.split('-');
                return parts[2] + '.' + parts[1] + '.' + parts[0];
            }

            function updateDisplay() {
                var from = fromHidden.value;
                var to = toHidden.value;
                if (from && to) {
                    display.value = formatDisplayDate(from) + ' – ' + formatDisplayDate(to);
                } else if (from) {
                    display.value = 'з ' + formatDisplayDate(from);
                } else if (to) {
                    display.value = 'по ' + formatDisplayDate(to);
                } else {
                    display.value = '';
                }
            }

            display.addEventListener('click', function () {
                fromInput.value = fromHidden.value;
                toInput.value = toHidden.value;
                overlay.hidden = false;
            });

            document.getElementById('applyDateRangeBtn').addEventListener('click', function () {
                fromHidden.value = fromInput.value;
                toHidden.value = toInput.value;
                updateDisplay();
                overlay.hidden = true;
            });

            document.getElementById('clearDateRangeBtn').addEventListener('click', function () {
                fromHidden.value = '';
                toHidden.value = '';
                updateDisplay();
                overlay.hidden = true;
            });

            document.getElementById('cancelDateRangeBtn').addEventListener('click', function () {
                overlay.hidden = true;
            });

            updateDisplay();
        });
    </script>
</body>
</html>
