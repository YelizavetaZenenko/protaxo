<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <div class="topbar" th:fragment="topbar(active)">
        <a class="brand" th:href="@{/invoices}">ProTaxo ERP</a>
        <nav>
            <a th:href="@{/clients}" th:classappend="${active == 'clients'} ? 'active'">Контрагенти</a>
            <a th:href="@{/vehicles}" th:classappend="${active == 'vehicles'} ? 'active'">Автомобілі</a>
            <a th:href="@{/contracts}" th:classappend="${active == 'contracts'} ? 'active'">Договори</a>
            <a th:href="@{/tachographs}" th:classappend="${active == 'tachographs'} ? 'active'">Тахографи</a>
            <a th:href="@{/invoices}" th:classappend="${active == 'invoices'} ? 'active'">Наряд-заказ</a>
            <a th:href="@{/catalog-items}" th:classappend="${active == 'catalog'} ? 'active'">Каталог</a>
            <a th:href="@{/calibration-protocols}" th:classappend="${active == 'calibration'} ? 'active'">Протоколи</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/audit-log}" th:classappend="${active == 'audit'} ? 'active'">Журнал дій</a>
        </nav>

        <div class="user-menu">
            <button type="button" class="user-menu-trigger" id="userMenuTrigger">
                <span class="user-avatar" th:text="${currentUser != null ? currentUser.initials : '?'}">??</span>
                <span th:text="${currentUser != null ? currentUser.fullName : ''}">Користувач</span>
                <span class="user-menu-caret">▾</span>
            </button>
            <div class="user-menu-dropdown" id="userMenuDropdown" hidden>
                <div class="user-menu-role" th:if="${currentUser != null}" th:text="${currentUser.roleLabel}"></div>
                <a th:href="@{/profile}"
                   th:classappend="${active == 'profile'} ? 'active'" class="user-menu-item">Мій профіль</a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/users}"
                   th:classappend="${active == 'users'} ? 'active'" class="user-menu-item">Користувачі</a>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="user-menu-item user-menu-logout">Вийти</button>
                </form>
            </div>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', function () {
                var trigger = document.getElementById('userMenuTrigger');
                var dropdown = document.getElementById('userMenuDropdown');
                if (!trigger || !dropdown) return;

                trigger.addEventListener('click', function (e) {
                    e.stopPropagation();
                    dropdown.hidden = !dropdown.hidden;
                });

                document.addEventListener('click', function (e) {
                    if (!dropdown.hidden && !dropdown.contains(e.target) && e.target !== trigger) {
                        dropdown.hidden = true;
                    }
                });
            });
        </script>

        <div id="invoiceDraftsSidebar" class="drafts-sidebar drafts-sidebar-left" hidden>
            <div class="drafts-sidebar-title">Незбережені наряд-закази</div>
            <div id="invoiceDraftsList"></div>
        </div>

        <div id="protocolDraftsSidebar" class="drafts-sidebar drafts-sidebar-right" hidden>
            <div class="drafts-sidebar-title">Незаписані протоколи</div>
            <div id="protocolDraftsList"></div>
        </div>

        <script>
            // Client-side-only draft tracking — nothing here ever touches the backend. A draft
            // is an editing session that has never been through the real "Зберегти" submit; see
            // docs/Наряд-заказ.md and docs/Протокол калібрування (CalibrationProtocol).md for the
            // full design. Included here (not a separate fragment) so both draft columns ride
            // along on every page for free, without editing every single template.
            //
            // One generic factory, instantiated twice: invoice drafts (left column, new-invoice
            // URL pattern) and calibration-protocol drafts (right column, new-protocol pattern).
            function createDraftStore(config) {
                function loadDrafts() {
                    try {
                        return JSON.parse(localStorage.getItem(config.storageKey)) || [];
                    } catch (e) {
                        return [];
                    }
                }

                function saveDrafts(drafts) {
                    localStorage.setItem(config.storageKey, JSON.stringify(drafts));
                    renderSidebar();
                }

                function renderSidebar() {
                    var sidebar = document.getElementById(config.sidebarId);
                    var list = document.getElementById(config.listId);
                    if (!sidebar || !list) return;
                    var drafts = loadDrafts();
                    list.innerHTML = '';
                    sidebar.hidden = drafts.length === 0;
                    document.body.classList.toggle(config.bodyClass, drafts.length > 0);

                    drafts.forEach(function (d) {
                        var item = document.createElement('div');
                        item.className = 'drafts-sidebar-item';

                        var link = document.createElement('a');
                        link.href = config.newUrl + '?draft=' + encodeURIComponent(d.id);
                        link.textContent = (d.dirty ? '* ' : '') + (d.label || config.defaultLabel);
                        item.appendChild(link);

                        var closeBtn = document.createElement('button');
                        closeBtn.type = 'button';
                        closeBtn.className = 'drafts-sidebar-close';
                        closeBtn.title = 'Прибрати чернетку';
                        closeBtn.textContent = '✕';
                        closeBtn.addEventListener('click', function (e) {
                            e.preventDefault();
                            store.remove(d.id);
                        });
                        item.appendChild(closeBtn);

                        list.appendChild(item);
                    });
                }

                var store = {
                    get: function (id) {
                        return loadDrafts().find(function (d) { return d.id === id; }) || null;
                    },
                    upsert: function (draft) {
                        var drafts = loadDrafts();
                        var idx = drafts.findIndex(function (d) { return d.id === draft.id; });
                        if (idx === -1) {
                            drafts.push(draft);
                        } else {
                            drafts[idx] = draft;
                        }
                        saveDrafts(drafts);
                    },
                    remove: function (id) {
                        saveDrafts(loadDrafts().filter(function (d) { return d.id !== id; }));
                    },
                    markPendingRemoval: function (id) {
                        sessionStorage.setItem(config.pendingRemovalKey, id);
                    }
                };

                document.addEventListener('DOMContentLoaded', function () {
                    var pendingId = sessionStorage.getItem(config.pendingRemovalKey);
                    if (pendingId) {
                        sessionStorage.removeItem(config.pendingRemovalKey);
                        store.remove(pendingId);
                    }
                    var sidebar = document.getElementById(config.sidebarId);
                    var topbar = document.querySelector('.topbar');
                    if (sidebar && topbar) {
                        sidebar.style.top = topbar.offsetHeight + 'px';
                    }
                    renderSidebar();
                });
                window.addEventListener('storage', renderSidebar);

                return store;
            }

            window.ProtaxoDrafts = createDraftStore({
                storageKey: 'protaxoInvoiceDrafts',
                pendingRemovalKey: 'protaxoPendingDraftRemoval',
                sidebarId: 'invoiceDraftsSidebar',
                listId: 'invoiceDraftsList',
                bodyClass: 'has-invoice-drafts-sidebar',
                newUrl: '/invoices/new',
                defaultLabel: 'Новий наряд-заказ'
            });

            window.ProtaxoProtocolDrafts = createDraftStore({
                storageKey: 'protaxoProtocolDrafts',
                pendingRemovalKey: 'protaxoPendingProtocolDraftRemoval',
                sidebarId: 'protocolDraftsSidebar',
                listId: 'protocolDraftsList',
                bodyClass: 'has-protocol-drafts-sidebar',
                newUrl: '/calibration-protocols/new',
                defaultLabel: 'Новий протокол'
            });
        </script>
    </div>
</body>
</html>
