<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <div class="topbar" th:fragment="topbar(active)">
        <a class="brand" th:href="@{/}">ProTaxo ERP</a>
        <!-- Бухгалтер — окремий акаунт "лише бухгалтерія" (docs/Фінансовий облік.md): бачить
             фінанси й каталог, решта розділів для нього закрита і в SecurityConfig. -->
        <nav sec:authorize="hasRole('ACCOUNTANT')">
            <a th:href="@{/finance}" th:classappend="${active == 'finance'} ? 'active'">Бухгалтерія</a>
            <a th:href="@{/catalog-items}" th:classappend="${active == 'catalog'} ? 'active'">Каталог</a>
        </nav>
        <nav sec:authorize="!hasRole('ACCOUNTANT')">
            <a th:href="@{/clients}" th:classappend="${active == 'clients'} ? 'active'">Контрагенти</a>
            <a th:href="@{/vehicles}" th:classappend="${active == 'vehicles'} ? 'active'">Автомобілі</a>
            <a th:href="@{/contracts}" th:classappend="${active == 'contracts'} ? 'active'">Договори</a>
            <a th:href="@{/invoices}" th:classappend="${active == 'invoices'} ? 'active'">Наряд-заказ</a>
            <a th:href="@{/catalog-items}" th:classappend="${active == 'catalog'} ? 'active'">Каталог</a>
            <a th:href="@{/calibration-protocols}" th:classappend="${active == 'calibration'} ? 'active'">Протоколи</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/finance}" th:classappend="${active == 'finance'} ? 'active'">Бухгалтерія</a>
            <a sec:authorize="hasRole('MASTER')" th:href="@{/finance/cash}" th:classappend="${active == 'finance'} ? 'active'">Каса</a>
            <a th:if="${canViewAuditLog}" th:href="@{/audit-log}" th:classappend="${active == 'audit'} ? 'active'">Журнал дій</a>
        </nav>

        <div class="user-menu">
            <button type="button" class="user-menu-trigger" id="userMenuTrigger">
                <span class="user-avatar" th:text="${currentUser != null ? currentUser.initials : '?'}">??</span>
                <span th:text="${currentUser != null ? currentUser.fullName : ''}">Користувач</span>
                <span class="user-menu-caret">▾</span>
            </button>
            <div class="user-menu-dropdown" id="userMenuDropdown" hidden>
                <div class="user-menu-role" th:if="${currentUser != null}" th:text="${currentUser.roleLabel}"></div>
                <a th:href="@{/profile}"
                   th:classappend="${active == 'profile'} ? 'active'" class="user-menu-item">Мій профіль</a>
                <a th:if="${canManageUsers}" th:href="@{/users}"
                   th:classappend="${active == 'users'} ? 'active'" class="user-menu-item">Користувачі</a>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="user-menu-item user-menu-logout">Вийти</button>
                </form>
            </div>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', function () {
                var trigger = document.getElementById('userMenuTrigger');
                var dropdown = document.getElementById('userMenuDropdown');
                if (!trigger || !dropdown) return;

                trigger.addEventListener('click', function (e) {
                    e.stopPropagation();
                    dropdown.hidden = !dropdown.hidden;
                });

                document.addEventListener('click', function (e) {
                    if (!dropdown.hidden && !dropdown.contains(e.target) && e.target !== trigger) {
                        dropdown.hidden = true;
                    }
                });
            });
        </script>

        <script>
            /**
             * Live-formats a phone <input> to +38(0XX)-XXX-XX-XX as the user types — letters
             * and any other non-digit characters are dropped, punctuation is inserted
             * automatically. Shared globally (unlike most small per-page scripts here) because
             * it's wired to every phone field across the site (Контрагенти, Працівники).
             */
            window.ProtaxoPhone = {
                PATTERN: /^\+38\(0\d{2}\)-\d{3}-\d{2}-\d{2}$/,
                mask: function (input) {
                    input.addEventListener('input', function () {
                        var digits = input.value.replace(/\D/g, '');
                        if (digits.indexOf('38') === 0) digits = digits.slice(2);
                        digits = digits.slice(0, 10);
                        var out = '+38';
                        if (digits.length > 0) out += '(' + digits.slice(0, 3);
                        if (digits.length >= 3) out += ')';
                        if (digits.length > 3) out += '-' + digits.slice(3, 6);
                        if (digits.length > 6) out += '-' + digits.slice(6, 8);
                        if (digits.length > 8) out += '-' + digits.slice(8, 10);
                        input.value = out;
                    });
                }
            };
        </script>

        <script th:inline="javascript">
            /**
             * Вихід із системи, коли закрито всі вкладки сайту (див. docs/Безпека і ролі.md).
             *
             * Пульс: кожна сторінка одразу після завантаження й далі кожні 15 с пінгує
             * /session/ping?start=<час старту сторінки>. Таймер живе у Web Worker-і — Chrome не
             * гальмує його у фонових вкладках (звичайний setInterval там раз на хвилину). Без пульсу
             * серверна сесія згасає за 60 с — це й запасний варіант, коли браузер закривають цілком
             * і він не встигає нічого надіслати.
             *
             * Закриття: відкриті вкладки реєструються в localStorage; на pagehide вкладка знімає себе,
             * і якщо живих не лишилось — sendBeacon /session/closing?t=<зараз> скорочує сесію до 10 с.
             * Перехід на іншу сторінку чи F5 теж дає pagehide, але нова сторінка стартує пізніше:
             * сервер порівнює мітки часу й не розлогінює (SessionLifecycleController).
             */
            (function () {
                var csrfToken = /*[[${_csrf != null ? _csrf.token : ''}]]*/ '';
                var KEY = 'protaxoOpenTabs';
                var PULSE_MS = 15000;
                var ALIVE_MS = 40000;
                var tabId = Math.random().toString(36).slice(2) + Date.now().toString(36);
                var pageStart = Date.now();
                var pingUrl = location.origin + '/session/ping';

                function readTabs() {
                    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
                }
                function writeTabs(tabs) {
                    try { localStorage.setItem(KEY, JSON.stringify(tabs)); } catch (e) { /* приватний режим */ }
                }
                function touch() {
                    var tabs = readTabs(), now = Date.now();
                    Object.keys(tabs).forEach(function (id) { if (now - tabs[id] > ALIVE_MS) delete tabs[id]; });
                    tabs[tabId] = now;
                    writeTabs(tabs);
                }
                function ping() {
                    fetch(pingUrl + '?start=' + pageStart, { credentials: 'same-origin', redirect: 'manual', cache: 'no-store' })
                        .catch(function () { /* мережа — наступний пульс спробує знову */ });
                }
                function pulse() { touch(); ping(); }

                pulse();
                var worker = null;
                try {
                    var code = 'setInterval(function(){postMessage(0)},' + PULSE_MS + ');';
                    worker = new Worker(URL.createObjectURL(new Blob([code], { type: 'text/javascript' })));
                    worker.onmessage = pulse;
                } catch (e) {
                    setInterval(pulse, PULSE_MS);
                }

                window.addEventListener('pageshow', function (e) {
                    if (e.persisted) { pageStart = Date.now(); pulse(); } // повернення з bfcache ("Назад")
                });
                window.addEventListener('pagehide', function () {
                    var tabs = readTabs(), now = Date.now();
                    delete tabs[tabId];
                    writeTabs(tabs);
                    var othersOpen = Object.keys(tabs).some(function (id) { return now - tabs[id] <= ALIVE_MS; });
                    if (!othersOpen && navigator.sendBeacon) {
                        navigator.sendBeacon('/session/closing?t=' + now, new URLSearchParams({ _csrf: csrfToken }));
                    }
                });
            })();
        </script>

        <div id="invoiceDraftsSidebar" class="drafts-sidebar drafts-sidebar-left" hidden>
            <div class="drafts-sidebar-title">Незбережені наряд-закази</div>
            <div id="invoiceDraftsList"></div>
        </div>

        <div id="protocolDraftsSidebar" class="drafts-sidebar drafts-sidebar-right" hidden>
            <div class="drafts-sidebar-title">Незаписані протоколи</div>
            <div id="protocolDraftsList"></div>
        </div>

        <script>
            // Client-side-only draft tracking — nothing here ever touches the backend. A draft
            // is an editing session that has never been through the real "Зберегти" submit; see
            // docs/Наряд-заказ.md and docs/Протокол калібрування (CalibrationProtocol).md for the
            // full design. Included here (not a separate fragment) so both draft columns ride
            // along on every page for free, without editing every single template.
            //
            // One generic factory, instantiated twice: invoice drafts (left column, new-invoice
            // URL pattern) and calibration-protocol drafts (right column, new-protocol pattern).
            function createDraftStore(config) {
                function loadDrafts() {
                    try {
                        return JSON.parse(localStorage.getItem(config.storageKey)) || [];
                    } catch (e) {
                        return [];
                    }
                }

                function saveDrafts(drafts) {
                    localStorage.setItem(config.storageKey, JSON.stringify(drafts));
                    renderSidebar();
                }

                function renderSidebar() {
                    var sidebar = document.getElementById(config.sidebarId);
                    var list = document.getElementById(config.listId);
                    if (!sidebar || !list) return;
                    var drafts = loadDrafts();
                    list.innerHTML = '';
                    sidebar.hidden = drafts.length === 0;
                    document.body.classList.toggle(config.bodyClass, drafts.length > 0);

                    drafts.forEach(function (d) {
                        var item = document.createElement('div');
                        item.className = 'drafts-sidebar-item';

                        var link = document.createElement('a');
                        link.href = config.newUrl + '?draft=' + encodeURIComponent(d.id);
                        link.textContent = (d.dirty ? '* ' : '') + (d.label || config.defaultLabel);
                        item.appendChild(link);

                        var closeBtn = document.createElement('button');
                        closeBtn.type = 'button';
                        closeBtn.className = 'drafts-sidebar-close';
                        closeBtn.title = 'Прибрати чернетку';
                        closeBtn.textContent = '✕';
                        closeBtn.addEventListener('click', function (e) {
                            e.preventDefault();
                            store.remove(d.id);
                        });
                        item.appendChild(closeBtn);

                        list.appendChild(item);
                    });
                }

                var store = {
                    get: function (id) {
                        return loadDrafts().find(function (d) { return d.id === id; }) || null;
                    },
                    upsert: function (draft) {
                        var drafts = loadDrafts();
                        var idx = drafts.findIndex(function (d) { return d.id === draft.id; });
                        if (idx === -1) {
                            drafts.push(draft);
                        } else {
                            drafts[idx] = draft;
                        }
                        saveDrafts(drafts);
                    },
                    remove: function (id) {
                        saveDrafts(loadDrafts().filter(function (d) { return d.id !== id; }));
                    },
                    markPendingRemoval: function (id) {
                        sessionStorage.setItem(config.pendingRemovalKey, id);
                    }
                };

                document.addEventListener('DOMContentLoaded', function () {
                    var pendingId = sessionStorage.getItem(config.pendingRemovalKey);
                    if (pendingId) {
                        sessionStorage.removeItem(config.pendingRemovalKey);
                        store.remove(pendingId);
                    }
                    var sidebar = document.getElementById(config.sidebarId);
                    var topbar = document.querySelector('.topbar');
                    if (sidebar && topbar) {
                        sidebar.style.top = topbar.offsetHeight + 'px';
                    }
                    renderSidebar();
                });
                window.addEventListener('storage', renderSidebar);

                return store;
            }

            window.ProtaxoDrafts = createDraftStore({
                storageKey: 'protaxoInvoiceDrafts',
                pendingRemovalKey: 'protaxoPendingDraftRemoval',
                sidebarId: 'invoiceDraftsSidebar',
                listId: 'invoiceDraftsList',
                bodyClass: 'has-invoice-drafts-sidebar',
                newUrl: '/invoices/new',
                defaultLabel: 'Новий наряд-заказ'
            });

            window.ProtaxoProtocolDrafts = createDraftStore({
                storageKey: 'protaxoProtocolDrafts',
                pendingRemovalKey: 'protaxoPendingProtocolDraftRemoval',
                sidebarId: 'protocolDraftsSidebar',
                listId: 'protocolDraftsList',
                bodyClass: 'has-protocol-drafts-sidebar',
                newUrl: '/calibration-protocols/new',
                defaultLabel: 'Новий протокол'
            });
        </script>
    </div>
</body>
</html>
