<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>ProTaxo — Тахографи</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/topbar :: topbar(active='tachographs')}"></div>

    <div class="container">
        <div class="card">
            <div class="toolbar">
                <h1>Тахографи</h1>
                <a class="btn" th:href="@{/tachographs/new}">+ Новий тахограф</a>
            </div>
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Автомобіль</th>
                    <th>Виробник / Модель</th>
                    <th>Серійний номер</th>
                    <th>Дата випуску</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${tachographs}">
                    <td th:text="${t.id}"></td>
                    <td th:text="${vehicleLabels[t.vehicleId]}"></td>
                    <td th:text="${t.manufacturer} + ' ' + ${t.model}"></td>
                    <td th:text="${t.serialNumber}"></td>
                    <td th:text="${t.productionDate}"></td>
                    <td class="actions-cell">
                        <a class="link-btn" th:href="@{/tachographs/{id}/edit(id=${t.id})}">Редагувати</a>
                        <form sec:authorize="hasRole('ADMIN')" th:action="@{/tachographs/{id}/delete(id=${t.id})}" method="post" style="display:inline">
                            <button type="submit" class="link-btn link-btn-danger"
                                    onclick="return confirm('Видалити тахограф?')">Видалити</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(tachographs)}">
                    <td colspan="6">Тахографів ще немає</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
