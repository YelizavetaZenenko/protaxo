<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <title>ProTaxo — Протоколи калібрування</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/topbar :: topbar(active='calibration')}"></div>

    <div class="container">
        <div class="card">
            <div class="toolbar">
                <h1>Протоколи калібрування</h1>
                <a class="btn" th:href="@{/calibration-protocols/new}">+ Новий протокол</a>
            </div>

            <form th:action="@{/calibration-protocols}" method="get" class="filter-bar">
                <div class="field">
                    <label for="filterDateDisplay">Дата</label>
                    <input type="text" id="filterDateDisplay" class="picker-input" readonly placeholder="Усі дати">
                    <input type="hidden" id="filterDate" name="filterDate" th:value="${filterDate}">
                </div>
                <div class="field">
                    <label for="filterInternalNumber">Внутрішній номер</label>
                    <input type="text" id="filterInternalNumber" name="filterInternalNumber" th:value="${filterInternalNumber}" placeholder="Пошук">
                </div>
                <div class="field filter-actions-field">
                    <label>&nbsp;</label>
                    <div class="filter-actions">
                        <button type="submit" class="btn-outline">Фільтрувати</button>
                        <a class="link-btn" th:if="${filterDate != null or filterInternalNumber != null}" th:href="@{/calibration-protocols}">Скинути фільтр</a>
                    </div>
                </div>
            </form>

            <table class="clean-table">
                <thead>
                <tr>
                    <th>№</th>
                    <th>Дата</th>
                    <th>Внутр. номер</th>
                    <th>Контрагент</th>
                    <th>Номер картки</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${protocols}" class="clickable-row" th:attr="data-href=@{/calibration-protocols/{id}(id=${p.id})}">
                    <td th:text="${#strings.replace(p.protocolNumber, '№', '')}"></td>
                    <td th:text="${#temporals.format(p.protocolDate, 'dd.MM.yyyy HH:mm')}"></td>
                    <td th:text="${p.internalNumber}"></td>
                    <td th:text="${clientNames[p.clientId]}"></td>
                    <td th:text="${p.cardNumber}"></td>
                    <td class="actions-cell">
                        <a class="link-btn" th:href="@{/calibration-protocols/{id}/edit(id=${p.id})}">Редагувати</a>
                        <form sec:authorize="hasRole('ADMIN')" th:action="@{/calibration-protocols/{id}/delete(id=${p.id})}" method="post" style="display:inline">
                            <button type="submit" class="link-btn link-btn-danger"
                                    onclick="return confirm('Видалити протокол?')">Видалити</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(protocols)}">
                    <td colspan="6">Протоколів ще немає</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal-overlay" id="dateModalOverlay" hidden>
        <div class="modal">
            <h2>Дата</h2>
            <div class="field">
                <label for="dateInput">Дата</label>
                <input type="date" id="dateInput">
            </div>
            <div class="form-actions">
                <button type="button" class="btn" id="applyDateBtn">Застосувати</button>
                <button type="button" class="btn-outline" id="clearDateBtn">Скинути</button>
                <button type="button" class="btn-outline" id="cancelDateBtn">Скасувати</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.clickable-row').forEach(function (row) {
                row.addEventListener('click', function (e) {
                    if (e.target.closest('.actions-cell')) return;
                    window.location.href = row.dataset.href;
                });
            });
        });
    </script>

    <script>
        /**
         * Той самий підхід, що на "Наряд-заказ" (invoices/list.html) — нативний
         * <input type="date"> показує дату у форматі локалі браузера, тому реальний
         * picker живе в модалці, а видиме поле фільтра завжди показує dd.mm.yyyy
         * незалежно від локалі.
         */
        document.addEventListener('DOMContentLoaded', function () {
            var display = document.getElementById('filterDateDisplay');
            var hidden = document.getElementById('filterDate');
            var overlay = document.getElementById('dateModalOverlay');
            var dateInput = document.getElementById('dateInput');

            function formatDisplayDate(iso) {
                var parts = iso.split('-');
                return parts[2] + '.' + parts[1] + '.' + parts[0];
            }

            function updateDisplay() {
                display.value = hidden.value ? formatDisplayDate(hidden.value) : '';
            }

            display.addEventListener('click', function () {
                dateInput.value = hidden.value;
                overlay.hidden = false;
            });

            document.getElementById('applyDateBtn').addEventListener('click', function () {
                hidden.value = dateInput.value;
                updateDisplay();
                overlay.hidden = true;
            });

            document.getElementById('clearDateBtn').addEventListener('click', function () {
                hidden.value = '';
                updateDisplay();
                overlay.hidden = true;
            });

            document.getElementById('cancelDateBtn').addEventListener('click', function () {
                overlay.hidden = true;
            });

            updateDisplay();
        });
    </script>
</body>
</html>
