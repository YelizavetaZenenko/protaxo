<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <title>ProTaxo — Протоколи калібрування</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/topbar :: topbar(active='calibration')}"></div>

    <div class="container">
        <div class="card" id="protocolsCard">
            <div class="toolbar">
                <h1>Протоколи калібрування</h1>
                <a class="btn" th:href="@{/calibration-protocols/new}">+ Новий протокол</a>
            </div>

            <form th:action="@{/calibration-protocols}" method="get" class="filter-bar">
                <input type="hidden" name="dir" th:value="${dir}">
                <div class="field">
                    <label for="filterDateDisplay">Дата</label>
                    <input type="text" id="filterDateDisplay" class="picker-input" readonly placeholder="Усі дати">
                    <input type="hidden" id="filterDateFrom" name="filterDateFrom" th:value="${filterDateFrom}">
                    <input type="hidden" id="filterDateTo" name="filterDateTo" th:value="${filterDateTo}">
                </div>
                <div class="field">
                    <label for="filterClientId">Контрагент</label>
                    <select id="filterClientId" name="filterClientId">
                        <option value="">— усі —</option>
                        <option th:each="c : ${clients}" th:value="${c.id}" th:text="${c.name}"
                                th:selected="${c.id == filterClientId}"></option>
                    </select>
                </div>
                <div class="field">
                    <label for="filterInternalNumber">Внутрішній номер</label>
                    <input type="text" id="filterInternalNumber" name="filterInternalNumber" th:value="${filterInternalNumber}" placeholder="Пошук">
                </div>
                <div class="field filter-actions-field">
                    <label>&nbsp;</label>
                    <div class="filter-actions">
                        <button type="submit" class="btn-outline">Фільтрувати</button>
                        <a class="link-btn" th:if="${filterDateFrom != null or filterDateTo != null or filterClientId != null or filterInternalNumber != null}" th:href="@{/calibration-protocols(dir=${dir})}">Скинути фільтр</a>
                    </div>
                </div>
            </form>

            <div class="protocol-legend">
                <span class="protocol-legend-swatch"></span> Протокол створено без наряд-заказу
                <span class="protocol-legend-comment" aria-hidden="true">💬</span> є внутрішній коментар
            </div>

            <table class="clean-table">
                <thead>
                <tr>
                    <th>№</th>
                    <th>
                        <a class="sort-link active"
                           th:href="@{/calibration-protocols(dir=${dir == 'asc' ? 'desc' : 'asc'}, filterDateFrom=${filterDateFrom}, filterDateTo=${filterDateTo}, filterClientId=${filterClientId}, filterInternalNumber=${filterInternalNumber})}">
                            Дата
                            <span th:text="${dir == 'asc'} ? '▲' : '▼'"></span>
                        </a>
                    </th>
                    <th>Внутр. номер</th>
                    <th>Контрагент</th>
                    <th>Номер картки</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${protocols}" class="clickable-row"
                    th:classappend="${p.invoiceId == null} ? 'protocol-row-standalone'"
                    th:attr="data-href=@{/calibration-protocols/{id}(id=${p.id})}">
                    <td>
                        <span th:text="${#strings.replace(p.protocolNumber, '№', '')}"></span>
                        <span class="protocol-comment-icon" th:if="${not #strings.isEmpty(p.internalComment)}"
                              th:title="${p.internalComment} + (${p.internalCommentUpdatedAt} != null ? ' — ' + ${p.internalCommentAuthor} + ', ' + ${#temporals.format(p.internalCommentUpdatedAt, 'dd.MM.yyyy HH:mm')} : '')" aria-label="Є внутрішній коментар">💬</span>
                    </td>
                    <td th:text="${#temporals.format(p.protocolDate, 'dd.MM.yyyy HH:mm')}"></td>
                    <td>
                        <span th:text="${p.internalNumber}"></span>
                        <span class="badge badge-standalone" th:if="${p.invoiceId == null}">без наряду</span>
                    </td>
                    <td th:text="${clientNames[p.clientId]}"></td>
                    <td th:text="${p.cardNumber}"></td>
                    <td class="actions-cell">
                        <a class="link-btn" th:href="@{/calibration-protocols/{id}/edit(id=${p.id})}">Редагувати</a>
                        <form sec:authorize="hasRole('ADMIN')" th:action="@{/calibration-protocols/{id}/delete(id=${p.id})}" method="post" style="display:inline">
                            <button type="submit" class="link-btn link-btn-danger"
                                    onclick="return confirm('Видалити протокол?')">Видалити</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(protocols)}">
                    <td colspan="6">Протоколів ще немає</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <button type="button" id="scrollTopBtn" class="scroll-top-btn" title="Нагору, до таблиці" hidden>↑ Нагору</button>

    <div class="modal-overlay" id="dateRangeModalOverlay" hidden>
        <div class="modal">
            <h2>Період</h2>
            <div class="field">
                <label for="dateRangeFromInput">Дата від</label>
                <input type="date" id="dateRangeFromInput">
            </div>
            <div class="field">
                <label for="dateRangeToInput">Дата до</label>
                <input type="date" id="dateRangeToInput">
            </div>
            <div class="form-actions">
                <button type="button" class="btn" id="applyDateRangeBtn">Застосувати</button>
                <button type="button" class="btn-outline" id="clearDateRangeBtn">Скинути</button>
                <button type="button" class="btn-outline" id="cancelDateRangeBtn">Скасувати</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var btn = document.getElementById('scrollTopBtn');
            var card = document.getElementById('protocolsCard');

            window.addEventListener('scroll', function () {
                btn.hidden = window.scrollY < 200;
            });

            btn.addEventListener('click', function () {
                card.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });

            document.querySelectorAll('.clickable-row').forEach(function (row) {
                row.addEventListener('click', function (e) {
                    if (e.target.closest('.actions-cell')) return;
                    window.location.href = row.dataset.href;
                });
            });
        });
    </script>

    <script>
        /**
         * Той самий фільтр-період, що на "Наряд-заказ" (invoices/list.html) — нативний
         * <input type="date"> показує дату у форматі локалі браузера, тому реальний
         * picker ("Дата від"/"Дата до") живе в модалці, а видиме поле фільтра завжди
         * показує dd.mm.yyyy незалежно від локалі.
         */
        document.addEventListener('DOMContentLoaded', function () {
            var display = document.getElementById('filterDateDisplay');
            var fromHidden = document.getElementById('filterDateFrom');
            var toHidden = document.getElementById('filterDateTo');
            var overlay = document.getElementById('dateRangeModalOverlay');
            var fromInput = document.getElementById('dateRangeFromInput');
            var toInput = document.getElementById('dateRangeToInput');

            function formatDisplayDate(iso) {
                var parts = iso.split('-');
                return parts[2] + '.' + parts[1] + '.' + parts[0];
            }

            function updateDisplay() {
                var from = fromHidden.value;
                var to = toHidden.value;
                if (from && to) {
                    display.value = formatDisplayDate(from) + ' – ' + formatDisplayDate(to);
                } else if (from) {
                    display.value = 'з ' + formatDisplayDate(from);
                } else if (to) {
                    display.value = 'по ' + formatDisplayDate(to);
                } else {
                    display.value = '';
                }
            }

            display.addEventListener('click', function () {
                fromInput.value = fromHidden.value;
                toInput.value = toHidden.value;
                overlay.hidden = false;
            });

            document.getElementById('applyDateRangeBtn').addEventListener('click', function () {
                fromHidden.value = fromInput.value;
                toHidden.value = toInput.value;
                updateDisplay();
                overlay.hidden = true;
            });

            document.getElementById('clearDateRangeBtn').addEventListener('click', function () {
                fromHidden.value = '';
                toHidden.value = '';
                updateDisplay();
                overlay.hidden = true;
            });

            document.getElementById('cancelDateRangeBtn').addEventListener('click', function () {
                overlay.hidden = true;
            });

            updateDisplay();
        });
    </script>
</body>
</html>
