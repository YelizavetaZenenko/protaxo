<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <title th:text="'ProTaxo — Наклейка ' + ${protocol.protocolNumber}"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* The exact PNG sent to the printer (LabelImageRenderer, 380x652 dots = 47.5x81.5mm);
           shown at a fixed CSS size with pixelated scaling so every printer dot stays visible. */
        .label-image {
            display: block;
            width: 285px;
            max-width: 100%;
            height: auto;
            margin: 0 auto;
            border: 2px dashed #999;
            border-radius: 4px;
            image-rendering: pixelated;
            background: #fff;
        }
        .label-verify-url { font-size: 0.75rem; color: #777; text-align: center; word-break: break-all; margin-top: 8px; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/topbar :: topbar(active='calibration')}"></div>

    <div class="container">
        <div class="card">
            <div class="toolbar">
                <h1 th:text="'Наклейка — Протокол ' + ${protocol.protocolNumber}"></h1>
                <div class="actions-cell">
                    <a class="btn-outline" th:href="@{/calibration-protocols/{id}(id=${protocol.id})}">Назад до протоколу</a>
                </div>
            </div>

            <p class="muted">
                Наклейка 47,5×81,5мм (книжкова орієнтація) — саме це зображення піде на принтер.
                Контрагент — <span th:text="${clientName}"></span> (для довідки, на самій наклейці не друкується).
            </p>

            <img class="label-image" th:src="${labelDataUri}" alt="Наклейка">
            <div class="label-verify-url" th:text="'QR-код веде на: ' + ${verifyUrl}"></div>
        </div>
    </div>
</body>
</html>
