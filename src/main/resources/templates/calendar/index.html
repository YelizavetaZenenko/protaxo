<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <title>ProTaxo — Календар</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/autocomplete.js}"></script>
    <style>
        /* Календар (docs/Календар.md): місяць або тиждень на все вікно, без прокрутки сторінки. */
        .cal-container { margin-top: 1rem; margin-bottom: 0; }
        .cal-shell {
            display: flex; flex-direction: column; min-height: 420px;
            background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
            box-shadow: var(--shadow-card);
        }
        .cal-toolbar {
            display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border); flex-wrap: wrap;
        }
        .cal-toolbar h1 { margin: 0 0 0 0.5rem; font-size: 1.25rem; font-weight: 600; min-width: 11rem; }
        .cal-toolbar .cal-spacer { flex: 1; }
        .cal-nav-btn {
            border: 1px solid var(--border); background: var(--surface); color: var(--text);
            border-radius: 8px; height: 2.2rem; min-width: 2.2rem; padding: 0 0.75rem;
            font: inherit; cursor: pointer;
        }
        .cal-nav-btn:hover { background: var(--bg); }
        .cal-nav-btn.cal-arrow { padding: 0; font-size: 1.2rem; line-height: 1; }
        .cal-month-input {
            border: 1px solid var(--border); border-radius: 8px; height: 2.2rem; padding: 0 0.5rem;
            font: inherit; color: var(--text); background: var(--surface);
        }
        .cal-month-input[hidden] { display: none; }
        .cal-seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .cal-seg button {
            border: none; background: var(--surface); color: var(--text); height: 2.2rem; padding: 0 0.9rem;
            font: inherit; cursor: pointer;
        }
        .cal-seg button + button { border-left: 1px solid var(--border); }
        .cal-seg button.on { background: var(--accent); color: #fff; }
        .cal-filter { position: relative; }
        .cal-filter-panel {
            position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; width: 300px;
            background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
            box-shadow: 0 8px 24px rgba(28, 43, 49, 0.14); padding: 0.9rem;
        }
        .cal-filter-panel[hidden] { display: none; }
        .cal-filter-title { font-size: 0.8rem; color: var(--muted); margin: 0 0 0.4rem; }
        .cal-day-toggles { display: flex; gap: 4px; }
        .cal-day-toggle {
            flex: 1; border: 1px solid var(--border); background: var(--surface); color: var(--text);
            border-radius: 6px; height: 2rem; font: inherit; font-size: 0.85rem; cursor: pointer;
        }
        .cal-day-toggle.on { background: var(--accent); border-color: var(--accent); color: #fff; }
        .cal-presets { display: flex; gap: 0.4rem; margin: 0.5rem 0 0.9rem; }
        .cal-presets button {
            border: none; background: var(--bg); color: var(--text); border-radius: 6px; padding: 0.25rem 0.6rem;
            font: inherit; font-size: 0.8rem; cursor: pointer;
        }
        .cal-presets button:hover { background: var(--border); }
        .cal-hours { display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; }
        .cal-hours input {
            width: 4rem; height: 2rem; border: 1px solid var(--border); border-radius: 6px; padding: 0 0.4rem; font: inherit;
        }

        .cal-body { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; border-radius: 0 0 12px 12px; }

        /* ---- Місяць */
        .cal-grid { flex: 1; display: grid; min-height: 0; }
        .cal-weekday {
            padding: 0.4rem 0.6rem; font-size: 0.8rem; color: var(--muted);
            border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.03em;
        }
        .cal-day {
            position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0;
            border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
            padding: 0.25rem 0.3rem 0.2rem; cursor: pointer; overflow: hidden;
        }
        .cal-day.cal-last-col { border-right: none; }
        .cal-day:hover { background: #f8faf9; }
        .cal-day.cal-weekend { background: #fafbfc; }
        .cal-day.cal-other-month .cal-day-num { color: #b4b9c2; }
        .cal-day.cal-other-month { background: #fcfcfd; }
        .cal-day-head { display: flex; align-items: center; justify-content: space-between; gap: 0.25rem; }
        .cal-day-num {
            display: inline-flex; align-items: center; justify-content: center; min-width: 1.7rem; height: 1.7rem;
            padding: 0 0.3rem; border-radius: 999px; font: inherit; font-size: 0.9rem; font-weight: 500;
            border: none; background: none; color: var(--text); cursor: pointer;
        }
        .cal-day-num:hover { background: var(--border); }
        .cal-day.cal-today .cal-day-num { background: var(--accent); color: #fff; }
        .cal-day-add {
            visibility: hidden; border: none; background: none; color: var(--accent); font-size: 1.1rem;
            cursor: pointer; line-height: 1; padding: 0 0.2rem;
        }
        .cal-day:hover .cal-day-add { visibility: visible; }
        .cal-events { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 2px; }
        .cal-event {
            display: block; width: 100%; text-align: left; border: none; cursor: pointer;
            background: #e6f1eb; color: var(--text); border-left: 3px solid var(--accent);
            border-radius: 4px; padding: 1px 5px; font: inherit; font-size: 0.8rem; line-height: 1.35;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0;
        }
        .cal-event:hover { background: #d4e8dc; }
        .cal-event .cal-event-time { font-weight: 600; margin-right: 0.3rem; }
        .cal-event.cal-past { background: #eef0f3; border-left-color: #a3aab5; color: var(--muted); }
        .cal-more {
            border: none; background: none; color: var(--accent); font: inherit; font-size: 0.8rem;
            text-align: left; padding: 0 5px; cursor: pointer; flex-shrink: 0;
        }
        .cal-more:hover { text-decoration: underline; }

        /* ---- Тиждень */
        .wk { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .wk-head { display: grid; border-bottom: 1px solid var(--border); }
        .wk-dayhead {
            border: none; border-left: 1px solid var(--border); background: none; text-align: left; cursor: pointer;
            padding: 0.35rem 0.6rem; font: inherit; font-size: 0.75rem; color: var(--muted); text-transform: uppercase;
        }
        .wk-dayhead:hover { background: #f8faf9; }
        .wk-dayhead b { display: block; font-size: 1.35rem; font-weight: 500; color: var(--text); text-transform: none; line-height: 1.2; }
        .wk-dayhead.wk-today, .wk-dayhead.wk-today b { color: var(--accent); }
        .wk-dayhead.wk-today b { font-weight: 700; }
        .wk-body { flex: 1; min-height: 0; overflow-y: auto; }
        .wk-inner { display: grid; position: relative; }
        .wk-times { position: relative; }
        .wk-time { position: absolute; right: 8px; font-size: 0.75rem; color: var(--muted); }
        .wk-col { position: relative; border-left: 1px solid var(--border); cursor: pointer; }
        .wk-col.wk-today-col { background-color: #f6fbf8; }
        .wk-col.wk-weekend-col { background-color: #fafbfc; }
        .wk-event {
            position: absolute; overflow: hidden; cursor: pointer; padding: 2px 6px; border-radius: 4px;
            background: #e6f1eb; border: 1px solid #fff; border-left: 3px solid var(--accent);
            font-size: 0.8rem; line-height: 1.3; color: var(--text); z-index: 1;
        }
        .wk-event:hover { background: #d4e8dc; z-index: 3; }
        .wk-event b { font-weight: 600; }
        .wk-event > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .wk-event .wk-sub { color: var(--muted); }
        .wk-event.wk-past { background: #eef0f3; border-left-color: #a3aab5; color: var(--muted); }
        .wk-now { position: absolute; left: 0; right: 0; height: 2px; background: #d93025; z-index: 2; pointer-events: none; }
        .wk-now::before {
            content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: #d93025;
        }

        .cal-status { padding: 0.25rem 1rem; font-size: 0.85rem; color: var(--danger); }
        .cal-form-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem; }
        .cal-dur { display: flex; align-items: center; gap: 0.35rem; color: var(--muted); }
        .field .cal-dur input { width: 4.2rem; padding-left: 0.5rem; padding-right: 0.3rem; }
        .cal-day-list { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; max-height: 55vh; overflow-y: auto; }
        .cal-day-list .cal-event { font-size: 0.95rem; padding: 0.45rem 0.6rem; white-space: normal; }
        .cal-day-list .cal-event small { display: block; color: var(--muted); }
        .cal-hint { font-size: 0.8rem; color: var(--muted); margin-top: 0.3rem; }
        .cal-warn { font-size: 0.85rem; color: #8a5a00; background: #fff6e0; border-radius: 8px; padding: 0.45rem 0.6rem; margin-bottom: 0.75rem; }
        .cal-modal-actions { display: flex; gap: 0.75rem; align-items: center; }
        .cal-modal-actions .cal-spacer { flex: 1; }
        /* .btn-danger задає display — без цього [hidden] не ховає «Видалити» у новому записі. */
        .cal-modal-actions [hidden] { display: none !important; }
        @media (max-width: 700px) {
            .cal-toolbar h1 { min-width: 0; font-size: 1.05rem; }
            .cal-event .cal-event-name { display: none; }
            .cal-form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/topbar :: topbar(active='calendar')}"></div>

    <div class="container cal-container">
        <div class="cal-shell" id="calShell">
            <div class="cal-toolbar">
                <button type="button" class="cal-nav-btn" id="calToday">Сьогодні</button>
                <button type="button" class="cal-nav-btn cal-arrow" id="calPrev">‹</button>
                <button type="button" class="cal-nav-btn cal-arrow" id="calNext">›</button>
                <h1 id="calTitle">Календар</h1>
                <input type="month" class="cal-month-input" id="calMonthPicker" title="Перейти до місяця">
                <input type="date" class="cal-month-input" id="calDatePicker" title="Перейти до тижня" hidden>
                <span class="cal-spacer"></span>
                <div class="cal-seg" role="group" aria-label="Вигляд">
                    <button type="button" id="calViewMonth" data-view="month">Місяць</button>
                    <button type="button" id="calViewWeek" data-view="week">Тиждень</button>
                </div>
                <div class="cal-filter">
                    <button type="button" class="cal-nav-btn" id="calFilterBtn">Дні й години ▾</button>
                    <div class="cal-filter-panel" id="calFilterPanel" hidden>
                        <div class="cal-filter-title">Які дні показувати</div>
                        <div class="cal-day-toggles" id="calDayToggles"></div>
                        <div class="cal-presets">
                            <button type="button" data-preset="1111100">Пн–Пт</button>
                            <button type="button" data-preset="1111110">Пн–Сб</button>
                            <button type="button" data-preset="1111111">Усі</button>
                        </div>
                        <div class="cal-filter-title">Години у вигляді «Тиждень»</div>
                        <div class="cal-hours">
                            з <input type="number" id="calHourFrom" min="0" max="23">
                            до <input type="number" id="calHourTo" min="1" max="24">
                        </div>
                    </div>
                </div>
                <button type="button" class="btn" id="calNewBtn">+ Новий запис</button>
            </div>
            <div class="cal-status" id="calStatus" hidden></div>
            <div class="cal-body" id="calBody"></div>
        </div>
    </div>

    <!-- Усі записи дня (коли в клітинці не вміщаються) -->
    <div class="modal-overlay" id="dayOverlay" hidden>
        <div class="modal">
            <h2 id="dayTitle"></h2>
            <div class="cal-day-list" id="dayList"></div>
            <div class="cal-modal-actions">
                <button type="button" class="btn" id="dayAddBtn">+ Додати запис</button>
                <span class="cal-spacer"></span>
                <button type="button" class="btn-outline" id="dayCloseBtn">Закрити</button>
            </div>
        </div>
    </div>

    <!-- Новий запис / редагування -->
    <div class="modal-overlay" id="apptOverlay" hidden>
        <div class="modal modal-wide" style="max-width:640px;">
            <h2 id="apptTitle">Новий запис</h2>
            <div class="alert alert-error" id="apptError" hidden></div>
            <div class="cal-warn" id="apptOverlap" hidden></div>
            <div class="cal-form-row">
                <div class="field">
                    <label for="apptDate">Дата *</label>
                    <input type="date" id="apptDate">
                </div>
                <div class="field">
                    <label for="apptTime">Час *</label>
                    <input type="time" id="apptTime" step="300">
                </div>
                <div class="field">
                    <label for="apptDurH">Тривалість *</label>
                    <div class="cal-dur">
                        <input type="number" id="apptDurH" min="0" max="12" step="1" inputmode="numeric"> год
                        <input type="number" id="apptDurM" min="0" max="59" step="5" inputmode="numeric"> хв
                    </div>
                </div>
            </div>
            <div class="field">
                <label for="apptClient">Клієнт *</label>
                <input type="text" id="apptClient" maxlength="255" autocomplete="off">
                <div class="cal-hint" id="apptClientHint"></div>
            </div>
            <div class="cal-form-row" style="grid-template-columns:1fr 2fr;">
                <div class="field">
                    <label for="apptPhone">Телефон</label>
                    <input type="text" id="apptPhone" maxlength="32">
                </div>
                <div class="field">
                    <label for="apptVehicle">Автомобіль</label>
                    <input type="text" id="apptVehicle" maxlength="255" list="apptVehicleList" autocomplete="off">
                    <datalist id="apptVehicleList"></datalist>
                </div>
            </div>
            <div class="field">
                <label for="apptNote">Примітка</label>
                <textarea id="apptNote" maxlength="2000"></textarea>
            </div>
            <div class="cal-modal-actions">
                <button type="button" class="btn" id="apptSaveBtn">Зберегти</button>
                <button type="button" class="btn-outline" id="apptCancelBtn">Скасувати</button>
                <span class="cal-spacer"></span>
                <a id="apptClientLink" href="#" target="_blank" hidden>Картка контрагента</a>
                <button type="button" class="btn-danger" id="apptDeleteBtn" hidden>Видалити</button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        var CLIENTS = JSON.parse(/*[[${clientOptionsJson}]]*/ '[]');
        /*]]>*/
    </script>
    <script>
        (function () {
            var MONTHS = ['Січень', 'Лютий', 'Березень', 'Квітень', 'Травень', 'Червень', 'Липень',
                'Серпень', 'Вересень', 'Жовтень', 'Листопад', 'Грудень'];
            var MONTHS_GEN = ['січня', 'лютого', 'березня', 'квітня', 'травня', 'червня', 'липня',
                'серпня', 'вересня', 'жовтня', 'листопада', 'грудня'];
            var MONTHS_SHORT = ['січ', 'лют', 'бер', 'квіт', 'трав', 'черв', 'лип', 'серп', 'вер', 'жовт', 'лист', 'груд'];
            var WEEKDAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'];             // індекс 0 = понеділок
            var WEEKDAYS_FULL = ['неділя', 'понеділок', 'вівторок', 'середа', 'четвер', "п'ятниця", 'субота']; // getDay()
            var LS_DAYS = 'protaxoCalendarDays', LS_HOURS = 'protaxoCalendarHours', LS_VIEW = 'protaxoCalendarView';
            var TIME_GUTTER = '56px';

            var shell = document.getElementById('calShell');
            var body = document.getElementById('calBody');
            var title = document.getElementById('calTitle');
            var monthPicker = document.getElementById('calMonthPicker');
            var datePicker = document.getElementById('calDatePicker');
            var statusBox = document.getElementById('calStatus');

            // ---- Допоміжне
            function pad(n) { return (n < 10 ? '0' : '') + n; }
            function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
            function addDays(d, n) { var r = new Date(d); r.setDate(r.getDate() + n); return r; }
            function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
            function parseLocal(s) { // "2026-11-23T09:30:00" — місцевий час, без зсуву
                var p = s.split(/[-T:]/).map(Number);
                return new Date(p[0], p[1] - 1, p[2], p[3] || 0, p[4] || 0);
            }
            function hhmm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
            function wd(d) { return (d.getDay() + 6) % 7; }           // 0 = понеділок
            function monday(d) { var r = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(r, -wd(r)); }
            function endOf(a) { return new Date(a.start.getTime() + a.durationMinutes * 6e4); }
            function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
            function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* приватний режим */ } }
            function el(tag, cls, text) {
                var e = document.createElement(tag);
                if (cls) e.className = cls;
                if (text != null) e.textContent = text;
                return e;
            }

            // ---- Стан: вигляд, дата, фільтр днів і годин (фільтр — у браузері, для кожного свій)
            var days = lsGet(LS_DAYS);
            if (!Array.isArray(days) || days.length !== 7 || !days.some(Boolean)) days = [true, true, true, true, true, true, true];
            var hours = lsGet(LS_HOURS);
            if (!hours || !(hours.from >= 0 && hours.to <= 24 && hours.from < hours.to)) hours = { from: 8, to: 19 };

            var params = new URLSearchParams(location.search);
            var view = params.get('view') || (params.get('month') ? 'month' : lsGet(LS_VIEW)) || 'month';
            if (view !== 'week') view = 'month';
            var anchor = new Date();
            var m;
            if ((m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(params.get('date') || ''))) anchor = new Date(+m[1], +m[2] - 1, +m[3]);
            else if ((m = /^(\d{4})-(\d{2})$/.exec(params.get('month') || ''))) anchor = new Date(+m[1], +m[2] - 1, 1);

            var appointments = [];
            var loadSeq = 0;

            /** Видимий період: сітка місяця з понеділка (4–6 тижнів) або тиждень Пн–Нд. */
            function range() {
                if (view === 'week') {
                    var s = monday(anchor);
                    return { start: s, end: addDays(s, 7) };
                }
                var first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
                var last = new Date(anchor.getFullYear(), anchor.getMonth() + 1, 0);
                return { start: monday(first), end: addDays(monday(last), 7) };
            }

            function visibleDates() {
                var r = range(), list = [];
                for (var d = new Date(r.start); d < r.end; d = addDays(d, 1)) {
                    if (days[wd(d)]) list.push(new Date(d));
                }
                return list;
            }

            /** Висота — до низу вікна, щоб увесь календар було видно без прокрутки сторінки. */
            function fitHeight() {
                var top = shell.getBoundingClientRect().top + window.scrollY;
                shell.style.height = Math.max(420, window.innerHeight - top - 16) + 'px';
            }

            function updateUrl() {
                var q = view === 'week'
                    ? '?view=week&date=' + iso(monday(anchor))
                    : '?view=month&month=' + anchor.getFullYear() + '-' + pad(anchor.getMonth() + 1);
                history.replaceState(null, '', location.pathname + q);
            }

            function weekTitle(s) {
                var e = addDays(s, 6);
                if (s.getMonth() === e.getMonth()) {
                    return s.getDate() + '–' + e.getDate() + ' ' + MONTHS_GEN[s.getMonth()] + ' ' + s.getFullYear();
                }
                return s.getDate() + ' ' + MONTHS_GEN[s.getMonth()] + (s.getFullYear() !== e.getFullYear() ? ' ' + s.getFullYear() : '')
                    + ' – ' + e.getDate() + ' ' + MONTHS_GEN[e.getMonth()] + ' ' + e.getFullYear();
            }

            function load() {
                var r = range();
                updateUrl();
                title.textContent = view === 'week' ? weekTitle(r.start) : MONTHS[anchor.getMonth()] + ' ' + anchor.getFullYear();
                monthPicker.hidden = view === 'week';
                datePicker.hidden = view !== 'week';
                monthPicker.value = anchor.getFullYear() + '-' + pad(anchor.getMonth() + 1);
                datePicker.value = iso(anchor);
                document.getElementById('calPrev').title = view === 'week' ? 'Попередній тиждень' : 'Попередній місяць';
                document.getElementById('calNext').title = view === 'week' ? 'Наступний тиждень' : 'Наступний місяць';
                document.getElementById('calViewMonth').classList.toggle('on', view === 'month');
                document.getElementById('calViewWeek').classList.toggle('on', view === 'week');
                appointments = [];
                render();
                var seq = ++loadSeq;
                fetch('/api/appointments?from=' + iso(r.start) + '&to=' + iso(r.end), { credentials: 'same-origin' })
                    .then(function (resp) {
                        if (!resp.ok) throw new Error('Не вдалося завантажити записи (' + resp.status + ')');
                        return resp.json();
                    })
                    .then(function (list) {
                        if (seq !== loadSeq) return;
                        statusBox.hidden = true;
                        appointments = list.map(function (a) { a.start = parseLocal(a.startsAt); return a; });
                        render();
                    })
                    .catch(function (err) {
                        if (seq !== loadSeq) return;
                        statusBox.textContent = err.message;
                        statusBox.hidden = false;
                    });
            }

            function render() {
                body.innerHTML = '';
                if (view === 'week') renderWeek(); else renderMonth();
            }

            function dayAppointments(day) {
                return appointments.filter(function (a) { return sameDay(a.start, day); })
                    .sort(function (a, b) { return a.start - b.start; });
            }

            function isPast(a) { return endOf(a).getTime() < Date.now(); }

            function tooltip(a) {
                return hhmm(a.start) + '–' + hhmm(endOf(a)) + ' ' + a.clientName + (a.vehicle ? ' — ' + a.vehicle : '')
                    + (a.phone ? '\n' + a.phone : '') + (a.note ? '\n' + a.note : '');
            }

            function eventButton(a) {
                var btn = el('button', 'cal-event' + (isPast(a) ? ' cal-past' : ''));
                btn.type = 'button';
                btn.appendChild(el('span', 'cal-event-time', hhmm(a.start)));
                btn.appendChild(el('span', 'cal-event-name', a.clientName));
                btn.title = tooltip(a);
                btn.addEventListener('click', function (e) { e.stopPropagation(); openAppointment(a, null); });
                return btn;
            }

            // ---- Місяць
            function renderMonth() {
                var cols = [0, 1, 2, 3, 4, 5, 6].filter(function (i) { return days[i]; });
                var lastCol = cols[cols.length - 1];
                var dates = visibleDates();
                var grid = el('div', 'cal-grid');
                grid.id = 'calGrid';
                grid.style.gridTemplateColumns = 'repeat(' + cols.length + ', minmax(0, 1fr))';
                grid.style.gridTemplateRows = 'auto repeat(' + Math.round(dates.length / cols.length) + ', minmax(0, 1fr))';
                cols.forEach(function (i) { grid.appendChild(el('div', 'cal-weekday', WEEKDAYS[i])); });
                var today = new Date();
                dates.forEach(function (day) {
                    var cell = dayCell(day, today);
                    if (wd(day) === lastCol) cell.classList.add('cal-last-col');
                    grid.appendChild(cell);
                });
                body.appendChild(grid);
                fitEvents(grid);
            }

            function dayCell(day, today) {
                var cell = el('div', 'cal-day');
                if (day.getMonth() !== anchor.getMonth()) cell.classList.add('cal-other-month');
                if (wd(day) >= 5) cell.classList.add('cal-weekend');
                if (sameDay(day, today)) cell.classList.add('cal-today');

                var head = el('div', 'cal-day-head');
                var num = el('button', 'cal-day-num', day.getDate() === 1 ? '1 ' + MONTHS_SHORT[day.getMonth()] : day.getDate());
                num.type = 'button';
                num.title = 'Відкрити тиждень';
                num.addEventListener('click', function (e) { e.stopPropagation(); setView('week', day); });
                var add = el('button', 'cal-day-add', '+');
                add.type = 'button';
                add.title = 'Новий запис';
                head.appendChild(num);
                head.appendChild(add);
                cell.appendChild(head);

                var list = el('div', 'cal-events');
                dayAppointments(day).forEach(function (a) { list.appendChild(eventButton(a)); });
                cell.appendChild(list);
                cell.addEventListener('click', function () { openAppointment(null, day); });
                cell._day = day;
                return cell;
            }

            /** Записи, що не влазять у клітинку, ховаємо під «+N ще» (як у Teams/Outlook). */
            function fitEvents(grid) {
                grid.querySelectorAll('.cal-day').forEach(function (cell) {
                    var list = cell.querySelector('.cal-events');
                    var chips = Array.prototype.slice.call(list.querySelectorAll('.cal-event'));
                    if (!chips.length || list.scrollHeight <= list.clientHeight) return;
                    var more = el('button', 'cal-more');
                    more.type = 'button';
                    more.addEventListener('click', function (e) { e.stopPropagation(); openDay(cell._day); });
                    list.appendChild(more);
                    var hidden = 0;
                    for (var i = chips.length - 1; i >= 0 && list.scrollHeight > list.clientHeight; i--) {
                        chips[i].style.display = 'none';
                        hidden++;
                        more.textContent = '+' + hidden + ' ще';
                    }
                });
            }

            // ---- Тиждень: шкала годин, записи — блоки за часом і тривалістю
            function renderWeek() {
                var dates = visibleDates();
                var today = new Date();
                var from = hours.from, to = hours.to;
                // Запис поза робочими годинами розширює шкалу, щоб його не загубити.
                appointments.forEach(function (a) {
                    if (!dates.some(function (d) { return sameDay(d, a.start); })) return;
                    var e = endOf(a);
                    from = Math.min(from, a.start.getHours());
                    to = Math.max(to, sameDay(e, a.start) ? e.getHours() + (e.getMinutes() > 0 ? 1 : 0) : 24);
                });
                var columns = TIME_GUTTER + ' repeat(' + dates.length + ', minmax(0, 1fr))';

                var wk = el('div', 'wk');
                var head = el('div', 'wk-head');
                head.style.gridTemplateColumns = columns;
                head.appendChild(el('div'));
                dates.forEach(function (d) {
                    var h = el('button', 'wk-dayhead' + (sameDay(d, today) ? ' wk-today' : ''));
                    h.type = 'button';
                    h.title = 'Новий запис на цей день';
                    h.appendChild(document.createTextNode(WEEKDAYS[wd(d)]));
                    h.appendChild(el('b', null, d.getDate() === 1 ? '1 ' + MONTHS_SHORT[d.getMonth()] : d.getDate()));
                    h.addEventListener('click', function () { openAppointment(null, d); });
                    head.appendChild(h);
                });
                var scroll = el('div', 'wk-body');
                var inner = el('div', 'wk-inner');
                inner.style.gridTemplateColumns = columns;
                scroll.appendChild(inner);
                wk.appendChild(head);
                wk.appendChild(scroll);
                body.appendChild(wk);

                // Години ділять доступну висоту порівну; якщо їх забагато — не менше 28px і прокрутка всередині.
                var hh = Math.max(28, Math.floor(scroll.clientHeight / (to - from)));
                inner.style.height = hh * (to - from) + 'px';

                var times = el('div', 'wk-times');
                for (var h = from; h < to; h++) {
                    var label = el('div', 'wk-time', pad(h) + ':00');
                    label.style.top = ((h - from) * hh + 2) + 'px';
                    times.appendChild(label);
                }
                inner.appendChild(times);

                dates.forEach(function (day) {
                    var col = el('div', 'wk-col');
                    if (sameDay(day, today)) col.classList.add('wk-today-col');
                    else if (wd(day) >= 5) col.classList.add('wk-weekend-col');
                    col.style.backgroundImage = 'linear-gradient(to bottom, var(--border) 1px, transparent 1px),'
                        + 'linear-gradient(to bottom, #f0f1f4 1px, transparent 1px)';
                    col.style.backgroundSize = '100% ' + hh + 'px, 100% ' + hh + 'px';
                    col.style.backgroundPosition = '0 0, 0 ' + Math.round(hh / 2) + 'px';

                    var items = dayAppointments(day).map(function (a) {
                        var s = a.start.getHours() * 60 + a.start.getMinutes();
                        return { a: a, s: s, e: Math.min(24 * 60, s + a.durationMinutes) };
                    });
                    layoutOverlaps(items);
                    items.forEach(function (it) { col.appendChild(weekEvent(it, from, hh)); });

                    if (sameDay(day, today)) {
                        var nowMin = today.getHours() * 60 + today.getMinutes();
                        if (nowMin >= from * 60 && nowMin <= to * 60) {
                            var line = el('div', 'wk-now');
                            line.style.top = ((nowMin - from * 60) / 60 * hh) + 'px';
                            col.appendChild(line);
                        }
                    }

                    col.addEventListener('click', function (e) {
                        var y = e.clientY - col.getBoundingClientRect().top;
                        var min = from * 60 + Math.floor(y / hh * 60 / 15) * 15;
                        openAppointment(null, day, Math.min(min, 23 * 60 + 45));
                    });
                    inner.appendChild(col);
                });

                // Смуга прокрутки звужує тіло — зсуваємо заголовки, щоб дні стояли над своїми колонками.
                head.style.paddingRight = (scroll.offsetWidth - scroll.clientWidth) + 'px';
                // Прокрутити до першого запису / поточного часу, якщо вся шкала не влазить.
                if (scroll.scrollHeight > scroll.clientHeight) {
                    var first = inner.querySelector('.wk-now, .wk-event');
                    if (first) scroll.scrollTop = Math.max(0, first.offsetTop - hh);
                }
            }

            /** Записи, що перетинаються в часі, стають поруч (як у Teams): колонки в межах групи. */
            function layoutOverlaps(items) {
                var group = null, groupEnd = -1, groups = [];
                items.forEach(function (it) {
                    if (!group || it.s >= groupEnd) { group = []; groups.push(group); groupEnd = -1; }
                    group.push(it);
                    groupEnd = Math.max(groupEnd, it.e);
                });
                groups.forEach(function (g) {
                    var colEnds = [];
                    g.forEach(function (it) {
                        var c = colEnds.findIndex(function (end) { return end <= it.s; });
                        if (c === -1) { c = colEnds.length; colEnds.push(it.e); } else { colEnds[c] = it.e; }
                        it.col = c;
                    });
                    g.forEach(function (it) { it.cols = colEnds.length; });
                });
            }

            function weekEvent(it, from, hh) {
                var a = it.a;
                var box = el('div', 'wk-event' + (isPast(a) ? ' wk-past' : ''));
                var top = (it.s - from * 60) / 60 * hh;
                var height = Math.max(18, (it.e - it.s) / 60 * hh - 1);
                box.style.top = top + 'px';
                box.style.height = height + 'px';
                box.style.left = 'calc(' + (it.col / it.cols * 100) + '% + 1px)';
                box.style.width = 'calc(' + (100 / it.cols) + '% - 3px)';
                box.title = tooltip(a);
                var line = el('div');
                line.appendChild(el('b', null, hhmm(a.start) + ' '));
                line.appendChild(document.createTextNode(a.clientName));
                box.appendChild(line);
                if (height > 38 && (a.vehicle || a.phone)) box.appendChild(el('div', 'wk-sub', [a.vehicle, a.phone].filter(Boolean).join(' · ')));
                if (height > 58 && a.note) box.appendChild(el('div', 'wk-sub', a.note));
                box.addEventListener('click', function (e) { e.stopPropagation(); openAppointment(a, null); });
                return box;
            }

            // ---- Навігація
            function setView(v, date) {
                view = v;
                if (date) anchor = new Date(date);
                lsSet(LS_VIEW, v);
                load();
            }
            function shift(delta) {
                anchor = view === 'week'
                    ? addDays(monday(anchor), 7 * delta)
                    : new Date(anchor.getFullYear(), anchor.getMonth() + delta, 1);
                load();
            }
            document.getElementById('calPrev').addEventListener('click', function () { shift(-1); });
            document.getElementById('calNext').addEventListener('click', function () { shift(1); });
            document.getElementById('calToday').addEventListener('click', function () { anchor = new Date(); load(); });
            document.getElementById('calViewMonth').addEventListener('click', function () { setView('month'); });
            document.getElementById('calViewWeek').addEventListener('click', function () {
                // З місяця — на тиждень із сьогоднішнім днем, якщо він у цьому місяці, інакше на перший тиждень місяця.
                var now = new Date();
                setView('week', now.getMonth() === anchor.getMonth() && now.getFullYear() === anchor.getFullYear() ? now : anchor);
            });
            monthPicker.addEventListener('change', function () {
                var mm = /^(\d{4})-(\d{2})$/.exec(monthPicker.value);
                if (mm) { anchor = new Date(+mm[1], +mm[2] - 1, 1); load(); }
            });
            datePicker.addEventListener('change', function () {
                var dd = /^(\d{4})-(\d{2})-(\d{2})$/.exec(datePicker.value);
                if (dd) { anchor = new Date(+dd[1], +dd[2] - 1, +dd[3]); load(); }
            });
            document.getElementById('calNewBtn').addEventListener('click', function () {
                var now = new Date(), dates = visibleDates();
                var inView = dates.some(function (d) { return sameDay(d, now); });
                openAppointment(null, inView ? now : (dates[0] || now));
            });

            // ---- Фільтр днів і годин
            var filterBtn = document.getElementById('calFilterBtn');
            var filterPanel = document.getElementById('calFilterPanel');
            var toggles = document.getElementById('calDayToggles');
            var hourFrom = document.getElementById('calHourFrom');
            var hourTo = document.getElementById('calHourTo');

            function filterLabel() {
                var on = days.map(function (v, i) { return v ? i : -1; }).filter(function (i) { return i >= 0; });
                var txt = on.length === 7 ? 'Усі дні'
                    : on.length === on[on.length - 1] - on[0] + 1 ? WEEKDAYS[on[0]] + '–' + WEEKDAYS[on[on.length - 1]]
                    : on.map(function (i) { return WEEKDAYS[i]; }).join(', ');
                filterBtn.textContent = txt + ' · ' + pad(hours.from) + ':00–' + pad(hours.to % 24) + ':00 ▾';
            }
            function renderToggles() {
                toggles.innerHTML = '';
                WEEKDAYS.forEach(function (name, i) {
                    var b = el('button', 'cal-day-toggle' + (days[i] ? ' on' : ''), name);
                    b.type = 'button';
                    b.setAttribute('aria-pressed', days[i] ? 'true' : 'false');
                    b.addEventListener('click', function () {
                        if (days[i] && days.filter(Boolean).length === 1) return; // хоч один день лишається
                        days[i] = !days[i];
                        applyFilter();
                    });
                    toggles.appendChild(b);
                });
                hourFrom.value = hours.from;
                hourTo.value = hours.to;
                filterLabel();
            }
            function applyFilter() {
                lsSet(LS_DAYS, days);
                lsSet(LS_HOURS, hours);
                renderToggles();
                render();
            }
            document.querySelectorAll('[data-preset]').forEach(function (b) {
                b.addEventListener('click', function () {
                    days = b.dataset.preset.split('').map(function (c) { return c === '1'; });
                    applyFilter();
                });
            });
            function onHours() {
                var f = parseInt(hourFrom.value, 10), t = parseInt(hourTo.value, 10);
                if (isNaN(f) || isNaN(t) || f < 0 || t > 24 || f >= t) return; // поки вводять — не чіпаємо
                hours = { from: f, to: t };
                applyFilter();
            }
            hourFrom.addEventListener('change', onHours);
            hourTo.addEventListener('change', onHours);
            filterBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                filterPanel.hidden = !filterPanel.hidden;
            });
            document.addEventListener('click', function (e) {
                if (!filterPanel.hidden && !filterPanel.contains(e.target) && e.target !== filterBtn) filterPanel.hidden = true;
            });
            renderToggles();

            document.addEventListener('keydown', function (e) {
                if (!dayOverlay.hidden || !apptOverlay.hidden) {
                    if (e.key === 'Escape') { apptOverlay.hidden = true; dayOverlay.hidden = true; }
                    return;
                }
                if (e.key === 'Escape') filterPanel.hidden = true;
                if (e.target.tagName === 'INPUT') return;
                if (e.key === 'ArrowLeft' && e.altKey) shift(-1);
                if (e.key === 'ArrowRight' && e.altKey) shift(1);
            });
            var resizeTimer;
            window.addEventListener('resize', function () {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function () { fitHeight(); render(); }, 100);
            });
            // Поки сторінка відкрита — щохвилини оновлюємо «зараз» і сірі минулі записи.
            setInterval(function () {
                var sc = body.querySelector('.wk-body');
                var top = sc ? sc.scrollTop : 0;
                render();
                sc = body.querySelector('.wk-body');
                if (sc) sc.scrollTop = top; // не збивати прокрутку тижня
            }, 60000);

            // ---- Усі записи дня
            var dayOverlay = document.getElementById('dayOverlay');
            var dayShown = null;
            function dayLabel(d) {
                return WEEKDAYS_FULL[d.getDay()].replace(/^./, function (c) { return c.toUpperCase(); })
                    + ', ' + d.getDate() + ' ' + MONTHS_GEN[d.getMonth()] + ' ' + d.getFullYear();
            }
            function openDay(day) {
                dayShown = day;
                document.getElementById('dayTitle').textContent = dayLabel(day);
                var list = document.getElementById('dayList');
                list.innerHTML = '';
                dayAppointments(day).forEach(function (a) {
                    var btn = eventButton(a);
                    btn.querySelector('.cal-event-time').textContent = hhmm(a.start) + '–' + hhmm(endOf(a));
                    if (a.vehicle || a.phone) btn.appendChild(el('small', null, [a.vehicle, a.phone].filter(Boolean).join(' · ')));
                    btn.addEventListener('click', function () { dayOverlay.hidden = true; });
                    list.appendChild(btn);
                });
                dayOverlay.hidden = false;
            }
            document.getElementById('dayCloseBtn').addEventListener('click', function () { dayOverlay.hidden = true; });
            document.getElementById('dayAddBtn').addEventListener('click', function () {
                dayOverlay.hidden = true;
                openAppointment(null, dayShown);
            });

            // ---- Форма запису
            var apptOverlay = document.getElementById('apptOverlay');
            var f = {
                title: document.getElementById('apptTitle'),
                error: document.getElementById('apptError'),
                overlap: document.getElementById('apptOverlap'),
                date: document.getElementById('apptDate'),
                time: document.getElementById('apptTime'),
                durH: document.getElementById('apptDurH'),
                durM: document.getElementById('apptDurM'),
                client: document.getElementById('apptClient'),
                clientHint: document.getElementById('apptClientHint'),
                phone: document.getElementById('apptPhone'),
                vehicle: document.getElementById('apptVehicle'),
                vehicleList: document.getElementById('apptVehicleList'),
                note: document.getElementById('apptNote'),
                del: document.getElementById('apptDeleteBtn'),
                link: document.getElementById('apptClientLink')
            };
            var editing = null;      // запис, що редагується (null — новий)
            var selectedClient = null;

            if (window.ProtaxoPhone) window.ProtaxoPhone.mask(f.phone);

            /** Тривалість у хвилинах із полів «год» і «хв»; NaN, якщо введено не число. */
            function duration() {
                var h = f.durH.value.trim() === '' ? 0 : Number(f.durH.value);
                var mi = f.durM.value.trim() === '' ? 0 : Number(f.durM.value);
                if (!Number.isInteger(h) || !Number.isInteger(mi) || h < 0 || mi < 0) return NaN;
                return h * 60 + mi;
            }
            function setDuration(min) {
                f.durH.value = Math.floor(min / 60);
                f.durM.value = min % 60;
            }

            function clientById(id) {
                return CLIENTS.find(function (c) { return c.id === id; }) || null;
            }

            function setClient(c) {
                selectedClient = c;
                f.vehicleList.innerHTML = '';
                (c ? c.vehicles : []).forEach(function (v) {
                    var o = document.createElement('option');
                    o.value = v;
                    f.vehicleList.appendChild(o);
                });
                f.link.hidden = !c;
                if (c) f.link.href = '/clients/' + c.id;
                updateClientHint();
            }

            function updateClientHint() {
                if (selectedClient) {
                    f.clientHint.textContent = 'З довідника контрагентів';
                } else if (f.client.value.trim()) {
                    f.clientHint.textContent = 'Немає в довіднику — збережеться лише ім\'я';
                } else {
                    f.clientHint.textContent = CLIENTS.length ? 'Почніть вводити назву або телефон' : '';
                }
            }

            ProtaxoAutocomplete.attach(f.client, {
                minLength: 1,
                emptyText: 'Немає в довіднику — можна записати просто ім\'я',
                source: function (q, done) {
                    var needle = q.toLowerCase();
                    var digits = q.replace(/\D/g, '');
                    done(CLIENTS.filter(function (c) {
                        return (c.name || '').toLowerCase().indexOf(needle) !== -1
                            || (digits.length >= 3 && (c.phone || '').replace(/\D/g, '').indexOf(digits) !== -1);
                    }).slice(0, 12).map(function (c) {
                        return { label: c.name, hint: [c.phone].concat(c.vehicles.slice(0, 2)).filter(Boolean).join(' · '), client: c };
                    }));
                },
                onSelect: function (item) {
                    f.client.value = item.client.name;
                    setClient(item.client);
                    if (!f.phone.value && item.client.phone) f.phone.value = item.client.phone;
                    if (!f.vehicle.value && item.client.vehicles.length === 1) f.vehicle.value = item.client.vehicles[0];
                    checkOverlap();
                }
            });
            f.client.addEventListener('input', function () {
                if (selectedClient && f.client.value.trim() !== selectedClient.name) setClient(null);
                updateClientHint();
            });

            function defaultTime(day) {
                var now = new Date();
                if (sameDay(day, now) && now.getHours() >= 8 && now.getHours() < 18) {
                    return pad(now.getHours() + 1) + ':00';
                }
                return pad(Math.max(hours.from, 8) % 24) + ':00';
            }

            /** a — наявний запис; інакше новий на день day (і, з тижневого вигляду, на хвилину minutes). */
            function openAppointment(a, day, minutes) {
                editing = a;
                f.title.textContent = a ? 'Запис' : 'Новий запис';
                f.error.hidden = true;
                f.date.value = iso(a ? a.start : day);
                f.time.value = a ? hhmm(a.start)
                    : minutes != null ? pad(Math.floor(minutes / 60)) + ':' + pad(minutes % 60) : defaultTime(day);
                setDuration(a ? a.durationMinutes : 60);
                f.client.value = a ? a.clientName : '';
                f.phone.value = a && a.phone ? a.phone : '';
                f.vehicle.value = a && a.vehicle ? a.vehicle : '';
                f.note.value = a && a.note ? a.note : '';
                setClient(a && a.clientId ? clientById(a.clientId) : null);
                f.del.hidden = !a;
                filterPanel.hidden = true;
                apptOverlay.hidden = false;
                checkOverlap();
                (a ? f.note : f.client).focus();
            }

            /** Попередження (не заборона), якщо час перетинається з іншим записом. */
            function checkOverlap() {
                var start = f.date.value && f.time.value ? parseLocal(f.date.value + 'T' + f.time.value) : null;
                var dur = duration();
                if (!start || !(dur > 0)) { f.overlap.hidden = true; return; }
                var end = start.getTime() + dur * 6e4;
                var clash = appointments.filter(function (a) {
                    if (editing && a.id === editing.id) return false;
                    return a.start.getTime() < end && endOf(a).getTime() > start.getTime();
                });
                f.overlap.hidden = !clash.length;
                f.overlap.textContent = clash.length
                    ? 'У цей час уже є запис: ' + clash.map(function (a) { return hhmm(a.start) + ' ' + a.clientName; }).join(', ')
                    : '';
            }
            [f.date, f.time, f.durH, f.durM].forEach(function (inp) {
                inp.addEventListener('change', checkOverlap);
                inp.addEventListener('input', checkOverlap);
            });

            function showError(msg) {
                f.error.textContent = msg;
                f.error.hidden = false;
            }

            document.getElementById('apptCancelBtn').addEventListener('click', function () { apptOverlay.hidden = true; });
            document.getElementById('apptSaveBtn').addEventListener('click', function () {
                var name = f.client.value.trim();
                var dur = duration();
                if (!f.date.value || !f.time.value) return showError('Вкажіть дату й час');
                if (isNaN(dur)) return showError('Тривалість — цілі числа годин і хвилин');
                if (dur < 5 || dur > 720) return showError('Тривалість — від 5 хвилин до 12 годин');
                if (!name) return showError('Вкажіть клієнта');
                var payload = {
                    startsAt: f.date.value + 'T' + f.time.value + ':00',
                    durationMinutes: dur,
                    clientId: selectedClient ? selectedClient.id : null,
                    clientName: name,
                    phone: f.phone.value.trim() || null,
                    vehicle: f.vehicle.value.trim() || null,
                    note: f.note.value.trim() || null
                };
                fetch(editing ? '/api/appointments/' + editing.id : '/api/appointments', {
                    method: editing ? 'PUT' : 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).then(function (resp) {
                    if (!resp.ok) {
                        return resp.json().catch(function () { return {}; }).then(function (b) {
                            throw new Error(b.message || 'Не вдалося зберегти запис');
                        });
                    }
                    return resp.json();
                }).then(function (saved) {
                    apptOverlay.hidden = true;
                    var d = parseLocal(saved.startsAt);
                    var r = range();
                    if (d < r.start || d >= r.end) anchor = d; // запис перенесли за межі видимого — переходимо туди
                    if (!days[wd(d)]) { days[wd(d)] = true; applyFilter(); } // день був схований фільтром
                    load();
                }).catch(function (err) { showError(err.message); });
            });
            f.del.addEventListener('click', function () {
                if (!editing || !confirm('Видалити запис ' + hhmm(editing.start) + ' ' + editing.clientName + '?')) return;
                fetch('/api/appointments/' + editing.id, { method: 'DELETE', credentials: 'same-origin' })
                    .then(function (resp) {
                        if (!resp.ok) throw new Error('Не вдалося видалити запис');
                        apptOverlay.hidden = true;
                        load();
                    })
                    .catch(function (err) { showError(err.message); });
            });

            fitHeight();
            load();
            // Шрифти й стилі можуть догрузитися пізніше й зсунути верх — перерахувати висоту.
            window.addEventListener('load', function () { fitHeight(); render(); });
        })();
    </script>
</body>
</html>
