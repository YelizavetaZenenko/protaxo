<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <title th:text="${editId} != null ? 'ProTaxo — Редагування контрагента' : 'ProTaxo — Новий контрагент'"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/topbar :: topbar(active='clients')}"></div>

    <div class="container">
        <div class="card">
            <h1 th:text="${editId} != null ? 'Редагування контрагента' : 'Новий контрагент'"></h1>

            <div class="alert alert-error" th:if="${formError}" th:text="${formError}"></div>

            <form th:object="${client}"
                  th:action="${editId} != null ? @{/clients/{id}/edit(id=${editId})} : @{/clients}"
                  method="post" class="form-grid">

                <div class="field field-full">
                    <label for="name">Назва *</label>
                    <input type="text" id="name" th:field="*{name}">
                    <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="field field-full">
                    <label for="fullName">Повна назва *</label>
                    <input type="text" id="fullName" th:field="*{fullName}" required>
                    <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <div class="field">
                    <label for="edrpou">Код ЄДРПОУ *</label>
                    <input type="text" id="edrpou" th:field="*{edrpou}" maxlength="8" inputmode="numeric" placeholder="12345678" required>
                    <div class="field-error" th:if="${#fields.hasErrors('edrpou')}" th:errors="*{edrpou}"></div>
                </div>

                <div class="field">
                    <label for="code">Код ІПН *</label>
                    <input type="text" id="code" th:field="*{code}" maxlength="12" inputmode="numeric" placeholder="123456789012" required>
                    <div class="field-error" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                </div>

                <div class="field">
                    <label for="email">Email *</label>
                    <input type="email" id="email" th:field="*{email}" required>
                    <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="field-full form-section">
                    <strong>Контактна особа</strong>
                </div>

                <div class="field">
                    <label for="lastName">Прізвище *</label>
                    <input type="text" id="lastName" th:field="*{lastName}" required>
                    <div class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                </div>

                <div class="field">
                    <label for="firstName">Ім'я *</label>
                    <input type="text" id="firstName" th:field="*{firstName}" required>
                    <div class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                </div>

                <div class="field">
                    <label for="middleName">По батькові *</label>
                    <input type="text" id="middleName" th:field="*{middleName}" required>
                    <div class="field-error" th:if="${#fields.hasErrors('middleName')}" th:errors="*{middleName}"></div>
                </div>

                <div class="field">
                    <label for="contactPersonPhone">Телефон *</label>
                    <input type="tel" id="contactPersonPhone" th:field="*{contactPersonPhone}"
                           placeholder="+38(0XX)-XXX-XX-XX" maxlength="19" inputmode="tel" required>
                    <div class="field-error" th:if="${#fields.hasErrors('contactPersonPhone')}" th:errors="*{contactPersonPhone}"></div>
                </div>

                <div class="field-full form-section">
                    <strong>Працівники</strong>
                </div>

                <div class="field field-full" th:if="${editId} == null">
                    <div class="muted">Спочатку збережіть контрагента.</div>
                </div>

                <div class="field field-full" th:if="${editId} != null">
                    <table class="clean-table" id="driversTable">
                        <colgroup>
                            <col style="width:34%">
                            <col style="width:22%">
                            <col style="width:22%">
                            <col style="width:22%">
                        </colgroup>
                        <thead>
                        <tr>
                            <th>ПІБ</th>
                            <th>Посада</th>
                            <th>Телефон</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody id="driversBody">
                        <tr th:each="d : ${drivers}" th:attr="data-id=${d.id},data-full-name=${d.fullName},data-phone=${d.phone},data-position=${d.position}">
                            <td th:text="${d.fullName}"></td>
                            <td th:text="${d.position}"></td>
                            <td th:text="${d.phone}"></td>
                            <td class="actions-cell">
                                <button type="button" class="link-btn edit-driver-btn">Редагувати</button>
                                <button type="button" class="link-btn link-btn-danger delete-driver-btn" sec:authorize="hasRole('ADMIN')">Видалити</button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <div class="muted" id="driversEmpty" th:if="${#lists.isEmpty(drivers)}">У цього контрагента ще немає працівників.</div>
                    <button type="button" class="btn-outline" id="addDriverBtn" style="margin-top:0.75rem;">+ Додати працівника</button>
                </div>

                <div class="field-full form-section">
                    <strong>Автомобілі</strong>
                </div>

                <div class="field field-full" th:if="${editId} == null">
                    <div class="muted">Спочатку збережіть контрагента.</div>
                </div>

                <div class="field field-full" th:if="${editId} != null">
                    <table class="clean-table">
                        <thead>
                        <tr>
                            <th>Держ. номер</th>
                            <th>VIN</th>
                            <th>Марка</th>
                            <th>Модель</th>
                            <th>Рік</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="v : ${vehicles}">
                            <td th:text="${v.registrationNumber}"></td>
                            <td th:text="${v.vin}"></td>
                            <td th:text="${v.make}"></td>
                            <td th:text="${v.model}"></td>
                            <td th:text="${v.year}"></td>
                            <td class="actions-cell">
                                <a class="link-btn" th:href="@{/vehicles/{id}/edit(id=${v.id})}">Редагувати</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(vehicles)}">
                            <td colspan="6">У цього контрагента ще немає автомобілів.</td>
                        </tr>
                        </tbody>
                    </table>
                    <button type="button" class="btn-outline" id="addVehicleBtn" style="margin-top:0.75rem;">+ Додати автомобіль</button>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn">Зберегти</button>
                    <a class="btn-outline" th:href="@{/clients}">Скасувати</a>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="confirmModalOverlay" hidden>
        <div class="modal">
            <h2>Підтвердження</h2>
            <p id="confirmModalMessage"></p>
            <div class="form-actions">
                <button type="button" class="btn" id="confirmModalYesBtn">Так, видалити</button>
                <button type="button" class="btn-outline" id="confirmModalNoBtn">Скасувати</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="driverModalOverlay" hidden>
        <div class="modal">
            <h2 id="driverModalTitle">Новий працівник</h2>
            <div class="alert alert-error" id="driverModalError" hidden></div>
            <div class="field field-full">
                <label for="driverFullName">ПІБ *</label>
                <input type="text" id="driverFullName">
            </div>
            <div class="field field-full">
                <label for="driverPosition">Посада</label>
                <input type="text" id="driverPosition" maxlength="255" placeholder="Водій, механік, диспетчер…">
            </div>
            <div class="field field-full">
                <label for="driverPhone">Телефон</label>
                <input type="tel" id="driverPhone" placeholder="+38(0XX)-XXX-XX-XX" maxlength="19">
            </div>
            <div class="form-actions">
                <button type="button" class="btn" id="saveDriverBtn">Зберегти</button>
                <button type="button" class="btn-outline" id="cancelDriverBtn">Скасувати</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var codeInput = document.getElementById('code');
            codeInput.addEventListener('input', function () {
                codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 12);
            });

            var edrpouInput = document.getElementById('edrpou');
            edrpouInput.addEventListener('input', function () {
                edrpouInput.value = edrpouInput.value.replace(/\D/g, '').slice(0, 8);
            });

            ProtaxoPhone.mask(document.getElementById('contactPersonPhone'));
            ProtaxoPhone.mask(document.getElementById('driverPhone'));
        });
    </script>

    <script th:inline="javascript">
        var editClientId = /*[[${editId}]]*/ null;
    </script>
    <script>
        /** Reusable styled replacement for window.confirm() — see #confirmModalOverlay. */
        function showConfirm(message, onConfirm) {
            var overlay = document.getElementById('confirmModalOverlay');
            var msgEl = document.getElementById('confirmModalMessage');
            var yesBtn = document.getElementById('confirmModalYesBtn');
            var noBtn = document.getElementById('confirmModalNoBtn');
            msgEl.textContent = message;
            overlay.hidden = false;
            function cleanup() {
                overlay.hidden = true;
                yesBtn.removeEventListener('click', onYes);
                noBtn.removeEventListener('click', onNo);
            }
            function onYes() { cleanup(); onConfirm(); }
            function onNo() { cleanup(); }
            yesBtn.addEventListener('click', onYes);
            noBtn.addEventListener('click', onNo);
        }
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (!editClientId) return;

            var driversBody = document.getElementById('driversBody');
            var driversEmpty = document.getElementById('driversEmpty');
            var addDriverBtn = document.getElementById('addDriverBtn');
            var driverModalOverlay = document.getElementById('driverModalOverlay');
            var driverModalTitle = document.getElementById('driverModalTitle');
            var driverModalError = document.getElementById('driverModalError');
            var driverFullName = document.getElementById('driverFullName');
            var driverPhone = document.getElementById('driverPhone');
            var driverPosition = document.getElementById('driverPosition');
            var editingDriverId = null;

            function openModal(title, id, fullName, phone, position) {
                editingDriverId = id;
                driverModalTitle.textContent = title;
                driverModalError.hidden = true;
                driverFullName.value = fullName || '';
                driverPhone.value = phone || '';
                driverPosition.value = position || '';
                driverModalOverlay.hidden = false;
                driverFullName.focus();
            }

            function addRow(driver) {
                var row = document.createElement('tr');
                row.dataset.id = driver.id;
                row.dataset.fullName = driver.fullName;
                row.dataset.phone = driver.phone || '';
                row.dataset.position = driver.position || '';

                var nameTd = document.createElement('td');
                nameTd.textContent = driver.fullName;
                row.appendChild(nameTd);

                var positionTd = document.createElement('td');
                positionTd.textContent = driver.position || '';
                row.appendChild(positionTd);

                var phoneTd = document.createElement('td');
                phoneTd.textContent = driver.phone || '';
                row.appendChild(phoneTd);

                var actionsTd = document.createElement('td');
                actionsTd.className = 'actions-cell';
                actionsTd.appendChild(buildEditButton());
                actionsTd.appendChild(buildDeleteButton());
                row.appendChild(actionsTd);

                driversBody.appendChild(row);
                if (driversEmpty) driversEmpty.hidden = true;
            }

            function buildEditButton() {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'link-btn edit-driver-btn';
                btn.textContent = 'Редагувати';
                return btn;
            }

            function buildDeleteButton() {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'link-btn link-btn-danger delete-driver-btn';
                btn.textContent = 'Видалити';
                return btn;
            }

            addDriverBtn.addEventListener('click', function () {
                openModal('Новий працівник', null, '', '', '');
            });

            var addVehicleBtn = document.getElementById('addVehicleBtn');
            addVehicleBtn.addEventListener('click', function () {
                window.location.href = '/vehicles/new?clientId=' + editClientId;
            });

            driversBody.addEventListener('click', function (e) {
                var row = e.target.closest('tr');
                if (!row) return;
                if (e.target.classList.contains('edit-driver-btn')) {
                    openModal('Редагування працівника', row.dataset.id, row.dataset.fullName, row.dataset.phone, row.dataset.position);
                } else if (e.target.classList.contains('delete-driver-btn')) {
                    showConfirm('Видалити працівника?', function () {
                        fetch('/api/drivers/' + row.dataset.id, { method: 'DELETE', credentials: 'same-origin' })
                            .then(function (resp) {
                                if (resp.ok) {
                                    row.remove();
                                    if (driversBody.children.length === 0 && driversEmpty) driversEmpty.hidden = false;
                                }
                            });
                    });
                }
            });

            document.getElementById('cancelDriverBtn').addEventListener('click', function () {
                driverModalOverlay.hidden = true;
            });

            document.getElementById('saveDriverBtn').addEventListener('click', function () {
                var fullName = driverFullName.value.trim();
                var phone = driverPhone.value.trim();
                var phonePattern = ProtaxoPhone.PATTERN;
                if (!fullName) {
                    driverModalError.textContent = "ПІБ обов'язкове";
                    driverModalError.hidden = false;
                    return;
                }
                if (!phone) {
                    driverModalError.textContent = 'Телефон обовʼязковий';
                    driverModalError.hidden = false;
                    return;
                }
                if (!phonePattern.test(phone)) {
                    driverModalError.textContent = 'Телефон має бути у форматі +38(0XX)-XXX-XX-XX';
                    driverModalError.hidden = false;
                    return;
                }
                var body = JSON.stringify({ clientId: editClientId, fullName: fullName, phone: phone, position: driverPosition.value.trim() || null });
                var url = editingDriverId ? '/api/drivers/' + editingDriverId : '/api/drivers';
                var method = editingDriverId ? 'PUT' : 'POST';

                fetch(url, {
                    method: method,
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: body
                }).then(function (resp) {
                    if (!resp.ok) {
                        return resp.json().then(function (b) { throw new Error(b.message || 'Не вдалося зберегти працівника'); });
                    }
                    return resp.json();
                }).then(function (saved) {
                    if (editingDriverId) {
                        var row = driversBody.querySelector('tr[data-id="' + editingDriverId + '"]');
                        if (row) {
                            row.dataset.fullName = saved.fullName;
                            row.dataset.phone = saved.phone || '';
                            row.dataset.position = saved.position || '';
                            row.children[0].textContent = saved.fullName;
                            row.children[1].textContent = saved.position || '';
                            row.children[2].textContent = saved.phone || '';
                        }
                    } else {
                        addRow(saved);
                    }
                    driverModalOverlay.hidden = true;
                }).catch(function (err) {
                    driverModalError.textContent = err.message;
                    driverModalError.hidden = false;
                });
            });
        });
    </script>
</body>
</html>
