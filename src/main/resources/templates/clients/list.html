<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <title>ProTaxo — Контрагенти</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/topbar :: topbar(active='clients')}"></div>

    <div class="container container-wide">
        <div class="card">
            <div class="toolbar">
                <h1>Контрагенти</h1>
                <a class="btn" th:href="@{/clients/new}">+ Новий контрагент</a>
            </div>

            <!-- Пошук одним рядком по всіх полях (назва, ЄДРПОУ, ІПН, ПІБ, телефон, email, адреса, IBAN…);
                 фільтрує одразу під час введення; запит потрапляє в адресу (?q=), тож посилання можна передати. -->
            <form th:action="@{/clients}" method="get" class="filter-bar" id="clientSearchForm">
                <div class="field" style="flex:1 1 420px">
                    <label for="clientSearch">Пошук</label>
                    <input type="search" id="clientSearch" name="q" th:value="${q}" autocomplete="off"
                           placeholder="Назва, ЄДРПОУ, ІПН, ПІБ, телефон, email, адреса, IBAN…">
                </div>
                <div class="field filter-actions-field">
                    <label>&nbsp;</label>
                    <div class="filter-actions">
                        <button type="button" class="link-btn" id="clientSearchReset" hidden>Скинути</button>
                        <span class="muted" id="clientSearchCount"></span>
                    </div>
                </div>
            </form>

            <table class="clean-table">
                <colgroup>
                    <col style="width:4%">
                    <col style="width:19%">
                    <col style="width:19%">
                    <col style="width:10%">
                    <col style="width:19%">
                    <col style="width:10%">
                    <col style="width:19%">
                </colgroup>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Назва</th>
                    <th>Повна назва</th>
                    <th>Код ЄДРПОУ</th>
                    <th>Контактна особа</th>
                    <th>Код ІПН</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${clients}" class="clickable-row client-row"
                    th:attr="data-href=@{/clients/{id}(id=${c.id})},data-search=${searchText[c.id]}">
                    <td class="nowrap-cell" th:text="${c.id}"></td>
                    <td th:text="${c.name}"></td>
                    <td th:text="${c.fullName}"></td>
                    <td class="nowrap-cell" th:text="${c.edrpou}"></td>
                    <td th:text="${#strings.trim((c.lastName ?: '') + ' ' + (c.firstName ?: '') + ' ' + (c.middleName ?: ''))}"></td>
                    <td class="nowrap-cell" th:text="${c.code}"></td>
                    <td class="actions-cell">
                        <a class="link-btn" th:href="@{/clients/{id}/edit(id=${c.id})}">Редагувати</a>
                        <form sec:authorize="hasRole('ADMIN')" th:action="@{/clients/{id}/delete(id=${c.id})}" method="post" style="display:inline">
                            <button type="submit" class="link-btn link-btn-danger"
                                    onclick="return confirm('Видалити контрагента?')">Видалити</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(clients)}">
                    <td colspan="7">Контрагентів ще немає</td>
                </tr>
                <tr id="clientSearchEmpty" hidden>
                    <td colspan="7">Нічого не знайдено</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.clickable-row').forEach(function (row) {
                row.addEventListener('click', function (e) {
                    if (e.target.closest('.actions-cell')) return;
                    window.location.href = row.dataset.href;
                });
            });

            // Миттєвий пошук: кожне слово має знайтися в data-search рядка (те саме, що робить сервер).
            var search = document.getElementById('clientSearch');
            var rows = Array.prototype.slice.call(document.querySelectorAll('.client-row'));
            var empty = document.getElementById('clientSearchEmpty');
            var count = document.getElementById('clientSearchCount');
            function normalize(text) {
                return (text || '').toLowerCase().replace(/[«»"'’ʼ]/g, '').replace(/\s+/g, ' ').trim();
            }
            function apply() {
                var words = normalize(search.value).split(' ').filter(Boolean);
                var shown = 0;
                rows.forEach(function (row) {
                    var hay = row.dataset.search || '';
                    var ok = words.every(function (w) { return hay.indexOf(w) !== -1; });
                    row.hidden = !ok;
                    if (ok) shown++;
                });
                empty.hidden = !(rows.length && shown === 0);
                count.textContent = words.length && rows.length ? 'Знайдено: ' + shown : '';
                reset.hidden = !words.length;
                try {
                    var url = new URL(window.location.href);
                    if (search.value.trim()) url.searchParams.set('q', search.value.trim()); else url.searchParams.delete('q');
                    history.replaceState(null, '', url);
                } catch (e) { /* адреса — лише зручність */ }
            }
            var reset = document.getElementById('clientSearchReset');
            reset.addEventListener('click', function () { search.value = ''; apply(); search.focus(); });
            document.getElementById('clientSearchForm').addEventListener('submit', function (e) { e.preventDefault(); apply(); });
            search.addEventListener('input', apply);
            apply();
            if (!search.value) search.focus();
        });
    </script>
</body>
</html>
