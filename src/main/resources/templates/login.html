<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ProTaxo — Вхід</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
    <div class="auth-card card">
        <img class="auth-logo" th:src="@{/images/logo.png}" alt="ProTaxo">
        <h1>Вхід до системи</h1>

        <div class="alert alert-error" th:if="${param.error}">
            Невірний email або пароль
        </div>
        <div class="alert alert-success" th:if="${param.logout}">
            Ви вийшли з системи
        </div>
        <div class="alert alert-success" th:if="${param.activated}">
            Акаунт активовано, тепер увійдіть
        </div>

        <form th:action="@{/login}" method="post">
            <div class="field">
                <label for="username">Email</label>
                <input type="email" id="username" name="username" autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-block">Увійти</button>
        </form>

        <div class="auth-footer">ProTaxo &middot; Ремонт та калібрування тахографів</div>
    </div>
</body>
</html>
