<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <title th:text="${editId} != null ? 'ProTaxo — Редагування договору' : 'ProTaxo — Новий договір'"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/topbar :: topbar(active='contracts')}"></div>

    <div class="container">
        <div class="card">
            <h1 th:text="${editId} != null ? 'Редагування договору' : 'Новий договір'"></h1>

            <form th:object="${contract}"
                  th:action="${editId} != null ? @{/contracts/{id}/edit(id=${editId})} : @{/contracts}"
                  method="post" class="form-grid">

                <div class="field">
                    <label>Номер договору</label>
                    <div th:if="${contractNumber} != null" th:text="${contractNumber}"></div>
                    <div th:if="${contractNumber} == null" class="muted">
                        буде проставлено автоматично при збереженні
                    </div>
                </div>

                <div class="field field-full">
                    <label for="clientId">Контрагент *</label>
                    <select id="clientId" th:field="*{clientId}">
                        <option value="">— оберіть клієнта —</option>
                        <option th:each="c : ${clients}" th:value="${c.id}" th:text="${c.name}"></option>
                    </select>
                    <div class="field-error" th:if="${#fields.hasErrors('clientId')}" th:errors="*{clientId}"></div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn">Зберегти</button>
                    <a class="btn-outline" th:href="@{/contracts}">Скасувати</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
