<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <title>ProTaxo — Договори</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/topbar :: topbar(active='contracts')}"></div>

    <div class="container">
        <div class="card">
            <div class="toolbar">
                <h1>Договори</h1>
                <a class="btn" th:href="@{/contracts/new}">+ Новий договір</a>
            </div>
            <table class="clean-table clean-table--fixed">
                <colgroup>
                    <col style="width:20%">
                    <col style="width:50%">
                    <col style="width:30%">
                </colgroup>
                <thead>
                <tr>
                    <th>Номер договору</th>
                    <th>Контрагент</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${contracts}" class="clickable-row" th:attr="data-href=@{/contracts/{id}(id=${c.id})}">
                    <td th:text="${c.contractNumber}"></td>
                    <td th:text="${clientNames[c.clientId]}"></td>
                    <td class="actions-cell">
                        <a class="link-btn" th:href="@{/contracts/{id}/edit(id=${c.id})}">Редагувати</a>
                        <a class="link-btn" th:href="@{/contracts/{id}/pdf(id=${c.id})}" target="_blank">Договір PDF</a>
                        <form sec:authorize="hasRole('ADMIN')" th:action="@{/contracts/{id}/delete(id=${c.id})}" method="post" style="display:inline">
                            <button type="submit" class="link-btn link-btn-danger"
                                    onclick="return confirm('Видалити договір?')">Видалити</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(contracts)}">
                    <td colspan="3">Договорів ще немає</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.clickable-row').forEach(function (row) {
                row.addEventListener('click', function (e) {
                    if (e.target.closest('.actions-cell')) return;
                    window.location.href = row.dataset.href;
                });
            });
        });
    </script>
</body>
</html>
