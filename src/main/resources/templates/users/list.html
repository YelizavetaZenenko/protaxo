<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <title>ProTaxo — Користувачі</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/topbar :: topbar(active='users')}"></div>

    <div class="container">
        <div class="card">
            <div class="toolbar">
                <h1>Користувачі</h1>
                <a class="btn" th:href="@{/users/new}">+ Запросити користувача</a>
            </div>

            <div class="alert alert-error" th:if="${formError}" th:text="${formError}"></div>

            <table class="clean-table">
                <colgroup>
                    <col style="width:20%">
                    <col style="width:24%">
                    <col style="width:12%">
                    <col style="width:16%">
                    <col style="width:16%">
                    <col style="width:12%">
                </colgroup>
                <thead>
                <tr>
                    <th>Ім'я</th>
                    <th>Email</th>
                    <th>Роль</th>
                    <th>Останній вхід</th>
                    <th>Статус</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.fullName}"></td>
                    <td th:text="${u.email}"></td>
                    <td><span class="badge" th:text="${u.role.label}"></span></td>
                    <td>
                        <span th:if="${u.lastLoginAt} != null" th:text="${#temporals.format(u.lastLoginAt, 'dd.MM.yyyy HH:mm')}"></span>
                        <span th:if="${u.lastLoginAt} == null" class="muted">Ще не входив(ла)</span>
                    </td>
                    <td>
                        <span th:if="${u.active}" class="badge">Активний</span>
                        <span th:unless="${u.active}" class="badge" style="background:#fbeceb;color:#b3261e;">Очікує підтвердження</span>
                    </td>
                    <td class="actions-cell">
                        <a class="link-btn" th:href="@{/users/{id}/edit(id=${u.id})}">Редагувати</a>
                        <form th:if="${canManageUsers}" th:action="@{/users/{id}/delete(id=${u.id})}" method="post" style="display:inline">
                            <button type="submit" class="link-btn link-btn-danger"
                                    onclick="return confirm('Видалити користувача?')">Видалити</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="6">Користувачів ще немає</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="card" style="margin-top:1.5rem;">
            <div class="toolbar">
                <h1>Робітники</h1>
                <button type="button" class="btn" id="addWorkerBtn" sec:authorize="hasRole('ADMIN')">+ Додати робітника</button>
            </div>

            <table class="clean-table">
                <thead>
                <tr>
                    <th>ПІБ</th>
                    <th>Посада</th>
                    <th>Телефон</th>
                    <th>Картка майстерні</th>
                    <th></th>
                </tr>
                </thead>
                <tbody id="workersTableBody">
                <tr th:each="w : ${workers}" class="clickable-row worker-row"
                    th:with="cardExpired=${w.workshopCardValidUntil != null and w.workshopCardValidUntil.isBefore(#temporals.createToday())}"
                    th:attr="data-id=${w.id},data-full-name=${w.fullName},data-position=${w.position},
                             data-phone=${w.phone},data-email=${w.email},data-address=${w.address},
                             data-hire-date=${w.hireDate},data-card-number=${w.workshopCardNumber},
                             data-card-valid-until=${w.workshopCardValidUntil},
                             data-emergency-contact=${w.emergencyContact},data-notes=${w.notes}">
                    <td th:text="${w.fullName}"></td>
                    <td th:text="${w.position}"></td>
                    <td class="nowrap-cell" th:text="${w.phone ?: '—'}"></td>
                    <td class="nowrap-cell">
                        <span th:text="${w.workshopCardNumber ?: '—'}"></span>
                        <span th:if="${w.workshopCardValidUntil != null}" class="muted"
                              th:classappend="${cardExpired} ? 'worker-card-expired'"
                              th:text="'до ' + ${#temporals.format(w.workshopCardValidUntil, 'dd.MM.yyyy')}"></span>
                    </td>
                    <td class="actions-cell">
                        <th:block sec:authorize="hasRole('ADMIN')">
                            <button type="button" class="link-btn edit-worker-btn">Редагувати</button>
                            <button type="button" class="link-btn link-btn-danger delete-worker-btn" th:attr="data-id=${w.id}">Видалити</button>
                        </th:block>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(workers)}">
                    <td colspan="5">Робітників ще немає</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal-overlay" id="viewWorkerOverlay" hidden>
        <div class="modal modal-wide">
            <h2 id="viewWorkerName"></h2>
            <div class="view-meta">
                <div class="field"><label>Посада</label><div data-field="position"></div></div>
                <div class="field"><label>Дата прийому на роботу</label><div data-field="hireDate" data-kind="date"></div></div>
                <div class="field"><label>Телефон</label><div data-field="phone" data-kind="phone"></div></div>
                <div class="field"><label>E-mail</label><div data-field="email" data-kind="email"></div></div>
                <div class="field worker-view-full"><label>Адреса</label><div data-field="address"></div></div>
                <div class="field"><label>Номер картки майстерні</label><div data-field="cardNumber"></div></div>
                <div class="field"><label>Картка дійсна до</label><div data-field="cardValidUntil" data-kind="date"></div></div>
                <div class="field worker-view-full"><label>Контакт для екстрених випадків</label><div data-field="emergencyContact"></div></div>
                <div class="field worker-view-full"><label>Примітки</label><div data-field="notes" class="worker-notes"></div></div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn" id="viewWorkerEditBtn" sec:authorize="hasRole('ADMIN')">Редагувати</button>
                <button type="button" class="btn-outline" id="viewWorkerCloseBtn">Закрити</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="addWorkerOverlay" hidden>
        <div class="modal modal-wide">
            <h2 id="workerModalTitle">Новий робітник</h2>
            <div class="alert alert-error" id="addWorkerError" hidden></div>
            <div class="form-grid worker-form">
                <div class="field">
                    <label for="newWorkerFullName">ПІБ *</label>
                    <input type="text" id="newWorkerFullName" data-key="fullName">
                </div>
                <div class="field">
                    <label for="newWorkerPosition">Посада *</label>
                    <input type="text" id="newWorkerPosition" data-key="position">
                </div>
                <div class="field">
                    <label for="newWorkerPhone">Телефон</label>
                    <input type="tel" id="newWorkerPhone" data-key="phone" placeholder="+380XXXXXXXXX">
                </div>
                <div class="field">
                    <label for="newWorkerEmail">E-mail</label>
                    <input type="email" id="newWorkerEmail" data-key="email">
                </div>
                <div class="field field-full">
                    <label for="newWorkerAddress">Адреса</label>
                    <input type="text" id="newWorkerAddress" data-key="address">
                </div>
                <div class="field">
                    <label for="newWorkerHireDate">Дата прийому на роботу</label>
                    <input type="date" id="newWorkerHireDate" data-key="hireDate">
                </div>
                <div class="field"></div>
                <div class="field">
                    <label for="newWorkerCardNumber">Номер картки майстерні</label>
                    <input type="text" id="newWorkerCardNumber" data-key="workshopCardNumber">
                </div>
                <div class="field">
                    <label for="newWorkerCardValidUntil">Картка дійсна до</label>
                    <input type="date" id="newWorkerCardValidUntil" data-key="workshopCardValidUntil">
                </div>
                <div class="field field-full">
                    <label for="newWorkerEmergency">Контакт для екстрених випадків</label>
                    <input type="text" id="newWorkerEmergency" data-key="emergencyContact" placeholder="Ім'я, ким доводиться, телефон">
                </div>
                <div class="field field-full">
                    <label for="newWorkerNotes">Примітки</label>
                    <textarea id="newWorkerNotes" data-key="notes" rows="3"></textarea>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn" id="saveNewWorkerBtn">Зберегти</button>
                <button type="button" class="btn-outline" id="cancelNewWorkerBtn">Скасувати</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var viewOverlay = document.getElementById('viewWorkerOverlay');
            var viewEditBtn = document.getElementById('viewWorkerEditBtn');
            var formOverlay = document.getElementById('addWorkerOverlay');
            var formError = document.getElementById('addWorkerError');
            var formTitle = document.getElementById('workerModalTitle');
            var formInputs = formOverlay.querySelectorAll('[data-key]');
            var viewedRow = null;
            var editingWorkerId = null;

            // Row data-* (dataset camelCase) → request field names.
            var ROW_TO_KEY = {
                fullName: 'fullName', position: 'position', phone: 'phone', email: 'email',
                address: 'address', hireDate: 'hireDate', cardNumber: 'workshopCardNumber',
                cardValidUntil: 'workshopCardValidUntil', emergencyContact: 'emergencyContact', notes: 'notes'
            };

            function formatDate(iso) {
                var p = iso.split('-');
                return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : iso;
            }

            function openView(row) {
                viewedRow = row;
                document.getElementById('viewWorkerName').textContent = row.dataset.fullName;
                viewOverlay.querySelectorAll('[data-field]').forEach(function (el) {
                    var value = row.dataset[el.dataset.field] || '';
                    el.textContent = '';
                    if (!value) {
                        el.textContent = '—';
                        return;
                    }
                    if (el.dataset.kind === 'phone' || el.dataset.kind === 'email') {
                        var a = document.createElement('a');
                        a.href = (el.dataset.kind === 'phone' ? 'tel:' : 'mailto:') + value.replace(/\s/g, '');
                        a.textContent = value;
                        el.appendChild(a);
                    } else {
                        el.textContent = el.dataset.kind === 'date' ? formatDate(value) : value;
                    }
                });
                viewOverlay.hidden = false;
            }

            function openForm(row) {
                editingWorkerId = row ? row.dataset.id : null;
                formTitle.textContent = row ? 'Редагувати робітника' : 'Новий робітник';
                formError.hidden = true;
                formInputs.forEach(function (input) { input.value = ''; });
                if (row) {
                    Object.keys(ROW_TO_KEY).forEach(function (rowKey) {
                        var input = formOverlay.querySelector('[data-key="' + ROW_TO_KEY[rowKey] + '"]');
                        input.value = row.dataset[rowKey] || '';
                    });
                }
                viewOverlay.hidden = true;
                formOverlay.hidden = false;
                document.getElementById('newWorkerFullName').focus();
            }

            document.querySelectorAll('.worker-row').forEach(function (row) {
                row.addEventListener('click', function (e) {
                    if (e.target.closest('.actions-cell')) return;
                    openView(row);
                });
            });

            document.querySelectorAll('.edit-worker-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    openForm(btn.closest('.worker-row'));
                });
            });

            var addWorkerBtn = document.getElementById('addWorkerBtn');
            if (addWorkerBtn) {
                addWorkerBtn.addEventListener('click', function () { openForm(null); });
            }
            if (viewEditBtn) {
                viewEditBtn.addEventListener('click', function () { openForm(viewedRow); });
            }
            document.getElementById('viewWorkerCloseBtn').addEventListener('click', function () {
                viewOverlay.hidden = true;
            });
            viewOverlay.addEventListener('click', function (e) {
                if (e.target === viewOverlay) viewOverlay.hidden = true;
            });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') viewOverlay.hidden = true;
            });

            document.querySelectorAll('.delete-worker-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    if (!confirm('Видалити робітника?')) return;
                    fetch('/api/repair-workers/' + btn.dataset.id, {
                        method: 'DELETE',
                        credentials: 'same-origin'
                    }).then(function (resp) {
                        if (!resp.ok) throw new Error('Не вдалося видалити робітника');
                        window.location.reload();
                    }).catch(function (err) {
                        alert(err.message);
                    });
                });
            });

            document.getElementById('cancelNewWorkerBtn').addEventListener('click', function () {
                formOverlay.hidden = true;
            });

            document.getElementById('saveNewWorkerBtn').addEventListener('click', function () {
                var body = {};
                formInputs.forEach(function (input) {
                    var v = input.value.trim();
                    body[input.dataset.key] = v === '' ? null : v;
                });
                if (!body.fullName || !body.position) {
                    formError.textContent = "ПІБ і посада обов'язкові";
                    formError.hidden = false;
                    return;
                }
                var url = editingWorkerId ? '/api/repair-workers/' + editingWorkerId : '/api/repair-workers';
                fetch(url, {
                    method: editingWorkerId ? 'PUT' : 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                }).then(function (resp) {
                    if (!resp.ok) {
                        return resp.json().then(function (b) { throw new Error(b.message || 'Не вдалося зберегти робітника'); });
                    }
                    return resp.json();
                }).then(function () {
                    window.location.reload();
                }).catch(function (err) {
                    formError.textContent = err.message;
                    formError.hidden = false;
                });
            });
        });
    </script>
</body>
</html>
