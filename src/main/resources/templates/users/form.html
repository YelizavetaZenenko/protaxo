<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <title th:text="${editId} != null ? 'ProTaxo — Редагування користувача' : 'ProTaxo — Запросити користувача'"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/topbar :: topbar(active='users')}"></div>

    <div class="container">
        <div class="card">
            <h1 th:text="${editId} != null ? 'Редагування користувача' : 'Запросити користувача'"></h1>

            <div class="alert alert-error" th:if="${formError}" th:text="${formError}"></div>

            <form th:object="${form}"
                  th:action="${editId} != null ? @{/users/{id}/edit(id=${editId})} : @{/users}"
                  method="post" class="form-grid">

                <div class="field">
                    <label for="fullName">Ім'я *</label>
                    <input type="text" id="fullName" th:field="*{fullName}">
                    <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <div class="field">
                    <label for="email">Email *</label>
                    <input type="email" id="email" th:field="*{email}">
                    <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="field">
                    <label for="role">Роль *</label>
                    <select id="role" th:field="*{role}">
                        <option value="">— оберіть роль —</option>
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                    </select>
                    <div class="field-error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
                </div>

                <div class="muted field-full" th:if="${editId} == null">
                    На вказану пошту буде надіслано лист із посиланням для встановлення пароля. Посилання дійсне 24 години.
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn" th:text="${editId} != null ? 'Зберегти' : 'Надіслати запрошення'"></button>
                    <a class="btn-outline" th:href="@{/users}">Скасувати</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
